  font-family: var(--mg-font-shout); font-size: clamp(34px, 8vw, 52px); letter-spacing: 2px;
  color: var(--mg-ink); text-shadow: 3px 3px 0 var(--mg-accent); margin-top: 6px;
}
.mg-subtitle { font-size: 20px; font-weight: 600; margin-top: 4px; }
.mg-tag {
  display: inline-block; margin-top: 8px; padding: 4px 10px;
  border-radius: 999px; background: #f5f3ff; color: var(--mg-bg-b);
  font-size: 13px; font-weight: 700; letter-spacing: 1px;
}
.mg-example {
  margin: 16px 0; padding: 14px; border-radius: 16px;
  background: #f5f3ff; border: 3px dashed var(--mg-bg-a); font-size: 18px;
}
.mg-big-btn {
  font-family: var(--mg-font-shout); font-size: 30px; letter-spacing: 2px;
  color: var(--mg-ink); background: var(--mg-accent);
  border: var(--mg-outline) solid var(--mg-ink); border-radius: 999px;
  padding: 14px 40px; min-height: 64px; cursor: pointer;
  box-shadow: 0 6px 0 var(--mg-ink); transition: transform 0.08s, box-shadow 0.08s;
}
.mg-big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--mg-ink); }

/* HUD */
.mg-hud {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; font-family: var(--mg-font-shout); letter-spacing: 1px;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35);
}
.cc-game .mg-hud,
.cc-game .mg-progress,
.cc-game .mg-stage { width: min(900px, calc(100% - 32px)); margin-left: auto; margin-right: auto; }
.cc-game .mg-hud { padding-left: 0; padding-right: 0; }
.cc-game .mg-progress { margin-top: 0; }
/* The size resolves on this element: it starts at the ceiling, and session.js
   writes the fitted size back into --mg-hud-title-size when the ceiling does
   not fit the header on one line. */
.mg-hud-title {
  --mg-hud-title-size: var(--mg-hud-title-max);
  font-size: var(--mg-hud-title-size);
  /* overflow: hidden is the last-ditch guard, and it clips both axes, so the
     line box has to hold the whole Bangers glyph box plus the header
     text-shadow. line-height: 1 cut the caps at the top and the tails at the
     bottom. */
  line-height: 1.35; overflow: hidden; white-space: nowrap; min-width: 0;
}
/* At the floor a long name wraps to two lines rather than truncating. Two
   lines at the 15px floor stand 36px, inside the 44px chip box. */
.mg-hud-title[data-hud-title-lines="2"] {
  white-space: normal; line-height: 1.2; overflow-wrap: break-word;
}
/* Compact widths take the ceiling down in proportion, 40px to 30px. */
@media (max-width: 560px) {
  :root { --mg-hud-title-max: 30px; }
}
/* Leave room for Bangers glyph overhang and the header shadow. */
:is(.cc-game, .eb-game, .ct-game, .reb-game) .mg-hud-title { padding-inline: 0.15em; }
.mg-chips { display: flex; gap: 8px; flex-shrink: 0; }
.mg-chip {
  background: var(--mg-card); color: var(--mg-ink); border: 3px solid var(--mg-ink);
  border-radius: 999px; padding: 4px 12px; font-size: 18px; text-shadow: none;
  box-shadow: 0 3px 0 var(--mg-ink);
}
.mg-chip-score { display: flex; align-items: center; justify-content: center; min-height: var(--mg-chip-box-height); line-height: 1; }
.cc-game .mg-card { width: min(900px, 100%); }
.mg-chip-streak.mg-hot { background: var(--mg-accent); animation: mg-pulse 0.8s infinite alternate; }
.mg-progress { height: 10px; margin: 0 14px; background: rgba(0, 0, 0, 0.25); border-radius: 999px; overflow: hidden; }
.mg-progress > i { display: block; height: 100%; width: 0; background: var(--mg-good); transition: width 0.3s; }

/* play area */
.mg-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 14px 14px; gap: 10px; }
.cc-game .mg-stage { flex: none; height: calc(100vh - 124px); min-height: 0; max-height: calc(100vh - 50px); display: grid; grid-template-rows: auto auto minmax(0, 1fr); padding: clamp(6px, 1vh, 10px) 0 50px; gap: 0; overflow: hidden; }
.mg-prompt {
  background: var(--mg-card); color: var(--mg-ink); border: var(--mg-outline) solid var(--mg-ink);
  border-radius: 20px; box-shadow: var(--mg-shadow); padding: 14px; text-align: center;
  font-size: clamp(20px, 4vw, 28px); font-weight: 600;
}
.mg-visual { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.cc-game .mg-visual { flex: none; min-height: 0; align-items: flex-start; margin-top: var(--cc-prompt-tray-gap); margin-bottom: var(--cc-tray-answers-gap); }
.mg-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mg-tiles[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mg-tile {
  min-height: 72px; font-family: var(--mg-font-read); font-weight: 700; font-size: 24px;
  color: var(--mg-ink); background: var(--mg-card);
  border: var(--mg-outline) solid var(--mg-ink); border-radius: 18px;
  box-shadow: 0 5px 0 var(--mg-ink); cursor: pointer; padding: 10px;
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
}
.mg-tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--mg-ink); }
.mg-tile[disabled] { cursor: default; }
.mg-tile.mg-right { background: var(--mg-good); }
.mg-tile.mg-wrong { background: var(--mg-warm); }
.cc-game .mg-tiles { width: 100%; min-height: 0; gap: var(--cc-answer-gap); grid-auto-rows: minmax(clamp(64px, 15vh, 180px), 1fr); }
.cc-game .mg-tile { min-height: 0; height: 100%; }

/* feedback */
.mg-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.mg-toast {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  font-family: var(--mg-font-shout); font-size: clamp(36px, 9vw, 64px); letter-spacing: 3px;
  color: #fff; text-shadow: 4px 4px 0 var(--mg-ink); animation: mg-toast 0.9s ease-out forwards;
}
.mg-toast-good { font-size: clamp(45px, 9vw, 84px); }
.mg-toast-warm { color: var(--mg-warm); font-size: clamp(28px, 7vw, 44px); }
.mg-toast-tier { color: var(--mg-accent); top: 30%; }
.mg-confetti {
  position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px;
  animation: mg-fall linear forwards;
}
.mg-fly { position: absolute; font-size: 28px; animation: mg-fly 0.9s ease-out forwards; }
.mg-shake { animation: mg-shake 0.35s; }
.mg-stats { display: flex; justify-content: center; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
.mg-stat { background: #f5f3ff; border: 3px solid var(--mg-ink); border-radius: 16px; padding: 10px 18px; min-width: 110px; }
.mg-stat b { display: block; font-family: var(--mg-font-shout); font-size: 32px; letter-spacing: 1px; }
.mg-hint { font-size: 14px; opacity: 0.7; margin-top: 10px; }

@media (max-width: 560px) {
  .cc-game .mg-tiles { gap: clamp(7px, 2vw, 12px); }
  .cc-game .mg-tile { min-height: clamp(64px, 15vw, 88px); --cc-pad: 7px; }
}

@media (max-height: 850px) {
  .cc-game .mg-tile { --cc-pad: clamp(7px, 1vh, 10px); }
}

@media (orientation: landscape) and (max-height: 500px) {
  .mg-toast-good { font-size: 45px; }
}

/* Standard Shell v1. Opt in with game.layout = 'standard'; legacy games keep
   the base shell above. Games add the semantic classes below to their own
   content without changing the shared stage DOM. */
.mg-shell-standard {
  --mg-standard-max-width: 920px;
  --mg-standard-gutter: 16px;
  --mg-standard-compact-gutter: 10px;
  --mg-standard-answer-shadow-depth: 6px;
  --mg-standard-answer-clearance: 60px;
  --mg-standard-answer-min-height: 104.85px;
  --mg-standard-answer-compact-min-height: 66.6px;
  --mg-standard-answer-narrow-min-height: 57.15px;
  --mg-standard-answer-landscape-height: 54px;
  /* Expression row. Sizes come from the ML 1.04 original: the label is a
     small line over a big value, and the value always leads. Games set
     colours only, through the --mg-expression-slot-* properties below. */
  --mg-expression-label-size: 32px;
  --mg-expression-value-size: clamp(26px, 5vw, 38px);
  --mg-expression-operator-size: 42px;
  --mg-expression-slot-min-height: 92px;
  --mg-expression-slot-padding: 6px 10px;
  --mg-expression-gap: 8px;
  --mg-expression-slot-radius: 12px;
  --mg-expression-slot-border-width: 3px;
  --mg-expression-slot-border-color: var(--mg-ink);
  --mg-expression-slot-bg: transparent;
  --mg-expression-slot-bg-filled: var(--mg-expression-slot-bg);
}
.mg-shell-standard .mg-hud,
.mg-shell-standard .mg-progress,
.mg-shell-standard .mg-stage {
  width: min(var(--mg-standard-max-width), calc(100% - (var(--mg-standard-gutter) * 2)));
  margin-left: auto;
  margin-right: auto;
}
.mg-shell-standard .mg-hud { padding: 10px 0; }
.mg-shell-standard .mg-hud-title { font-size: var(--mg-hud-title-size); }
.mg-shell-standard .mg-chip { font-size: 18px; }
.mg-shell-standard .mg-progress { height: 10px; }
.mg-shell-standard .mg-stage {
  gap: 20px;
  padding: 10px 0 calc(var(--mg-standard-answer-clearance) + var(--mg-standard-answer-shadow-depth) + env(safe-area-inset-bottom, 0px));
}
.mg-shell-standard .mg-prompt { font-size: 28px; }
.mg-shell-standard .mg-visual { flex: 1 1 auto; }
.mg-shell-standard .mg-problem-card {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}
.mg-shell-standard .mg-problem-card .mg-expression-row { min-width: 0; }
.mg-shell-standard .mg-tiles {
  width: min(686px, 85%);
  align-self: center;
  gap: 10.8px;
}
.mg-shell-standard .mg-tile {
  min-height: var(--mg-standard-answer-min-height);
  font-size: clamp(24px, 4vw, 32px);
  box-shadow: 0 var(--mg-standard-answer-shadow-depth) 0 var(--mg-ink);
}
.mg-shell-standard .mg-tile:active { box-shadow: 0 2px 0 var(--mg-ink); }

/* Semantic content classes. Games own their content layout and add these
   alongside local class names to receive the shared type floors. */
/* No :where() here: the shell's type declarations must beat a game's local
   class on specificity, so these carry the full .mg-shell-standard .mg-class
   weight and win over a single game class. */
.mg-shell-standard :is(.mg-problem-body, .mg-card-stem) {
  font-size: 32px;
  line-height: 1.3;
}
/* An instruction stem inside the problem card is story copy: `.mg-card-stem`
   is typed identically to `.mg-problem-body` at every breakpoint, so a stem
   reads at the story size in the card's own ink colour. */
/* The same rule outside the Standard Shell, where the card is the prompt
   itself: the stem takes the story's own size, weight and colour by
   inheriting them, and drops to the shell's 15px story floor on compact
   widths so two sentences still hold two lines on a phone. The Standard
   Shell rules above and below outrank this on specificity, so they keep
   their own sizes. */
.mg-card-stem { font-size: inherit; font-weight: inherit; color: inherit; }
@media (max-width: 560px) {
  .mg-card-stem { font-size: 15px; }
}
/* Expression row: slots across the card, each a small label line over a big
   value line, with the operator between. The unknown slot is dashed. The
   value line reserves its height so the geometry never shifts. */
.mg-shell-standard .mg-expression-row {
  display: flex;
  align-items: stretch;
  justify-content: center;
  min-width: 0;
  gap: var(--mg-expression-gap);
}
.mg-shell-standard .mg-expression-slot {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  align-content: center;
  justify-items: center;
  row-gap: 2px;
  min-height: var(--mg-expression-slot-min-height);
  padding: var(--mg-expression-slot-padding);
  border: var(--mg-expression-slot-border-width) solid var(--mg-expression-slot-border-color);
  border-radius: var(--mg-expression-slot-radius);
  background: var(--mg-expression-slot-bg-filled);
}
.mg-shell-standard .mg-expression-slot--unknown {
  border-style: dashed;
  background: var(--mg-expression-slot-bg);
}
.mg-shell-standard .mg-expression-label {
  max-width: 100%;
  font-family: var(--mg-font-read);
  font-size: var(--mg-expression-label-size);
  font-weight: 700;
  line-height: var(--mg-expression-label-line-height, 1.05);
}
.mg-shell-standard .mg-expression-value {
  display: flex;
  align-items: baseline;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 0.18em;
  max-width: 100%;
  min-height: 1.15em;
  font-family: var(--mg-font-shout);
  font-size: var(--mg-expression-value-size);
  font-weight: 400;
  line-height: var(--mg-expression-value-line-height, 1.15);
}
.mg-shell-standard .mg-expression-row--readable-numerals .mg-expression-value {
  font-family: var(--mg-font-read);
  font-weight: 700;
}
.mg-shell-standard .mg-expression-value .mg-expression-operator { font-size: 1em; }
.mg-shell-standard .mg-expression-operator {
  align-self: center;
  font-family: var(--mg-font-shout);
  font-size: var(--mg-expression-operator-size);
  font-weight: 400;
  line-height: 1.15;
}
.mg-shell-standard .mg-feedback-line,
.mg-shell-standard .mg-help-copy,
.mg-shell-standard .mg-toast-warm {
  font-size: clamp(15px, 3vw, 28px);
  line-height: 1.1;
}
.mg-shell-standard .mg-toast-good { line-height: 1.1; }
.mg-shell-standard .mg-feedback-line {
  font-family: var(--mg-font-read);
  font-weight: 700;
  min-height: 31px;
  overflow: hidden;
}
.mg-shell-standard .mg-feedback-line:empty { visibility: hidden; }
.mg-shell-standard .mg-help-panel { min-width: 0; }
.mg-shell-standard .mg-kid-label:not(.mg-expression-label):not(.mg-expression-value):not(.mg-expression-operator),
.mg-shell-standard .mg-stat {
  font-size: max(15px, 1em);
}
.mg-shell-standard .mg-tag,
.mg-shell-standard .mg-hint {
  font-size: 15px;
}

/* Problem card interior + Expression row. Opt in with `mg-card-column` on the
   problem card (and `mg-card-picture` on its picture child), paired with
   `mg-expression-row` on equation rows. The shell owns every value below; a
   game overrides nothing. 103 and 104 do not opt in, so these selectors never
   match their DOM. Values track docs/game-guidelines.md. */
.mg-shell-standard .mg-card-column {
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 12px; /* floor, normal; space-evenly grows gaps equally above it */
}
.mg-shell-standard .mg-card-column > .mg-card-picture {
  max-height: 40vh; /* normal; keeps the picture from absorbing the slack */
  min-height: 0;
}
.mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall {
  max-height: 55vh;
}
/* Ceiling: on tall viewports the even share would exceed 32px, so stop
   stretching, let the card size to its content, and centre it in the stage. */
@media (min-height: 900px) {
  .mg-shell-standard .mg-card-column {
    flex: 0 1 auto;
    height: auto;
    margin-top: auto;
    margin-bottom: auto;
  }
}

@media (max-width: 560px) {
  .mg-shell-standard .mg-hud,
  .mg-shell-standard .mg-progress,
  .mg-shell-standard .mg-stage {
    width: min(var(--mg-standard-max-width), calc(100% - (var(--mg-standard-compact-gutter) * 2)));
  }
  .mg-shell-standard .mg-prompt { font-size: 20px; }
  .mg-shell-standard .mg-stage { gap: 14px; }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-compact-min-height); }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem) { font-size: 18px; line-height: 1.3; }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem).mg-problem-body--fit2 { font-size: 15px; }
  .mg-shell-standard {
    --mg-expression-label-size: 18px;
    --mg-expression-value-size: 31.5px;
    --mg-expression-operator-size: 37.8px;
    --mg-expression-slot-min-height: 68px;
    --mg-expression-slot-padding: 4px 6px;
    --mg-expression-gap: 6px;
    --mg-expression-slot-radius: 10px;
    --mg-expression-slot-border-width: 2px;
  }
  .mg-shell-standard .mg-card-column { gap: 8px; }
  .mg-shell-standard .mg-card-column > .mg-card-picture { max-height: 30vh; }
  .mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall { max-height: 40vh; }
}

@media (max-width: 360px) and (max-height: 600px) {
  .mg-shell-standard {
    --mg-expression-label-size: 15px;
    --mg-expression-value-size: 26px;
    --mg-expression-operator-size: 30px;
    --mg-expression-slot-min-height: 52px;
    --mg-expression-slot-padding: 2px 4px;
    --mg-expression-gap: 4px;
  }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-narrow-min-height); }
}

@media (orientation: landscape) and (max-height: 500px) {
  .mg-shell-standard .mg-stage { gap: 14px; padding-top: 4px; }
  .mg-shell-standard .mg-prompt { font-size: 20px; }
  .mg-shell-standard .mg-tiles { flex: 0 0 var(--mg-standard-answer-landscape-height); }
  .mg-shell-standard .mg-tiles[data-count="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-landscape-height); padding: 4px 10px; line-height: 1; }
  .mg-card-stem { font-size: 15px; }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem) { font-size: 15px; line-height: 1.1; }
  .mg-shell-standard {
    --mg-expression-label-size: 15px;
    --mg-expression-value-size: 31.5px;
    --mg-expression-operator-size: 37.8px;
    --mg-expression-slot-min-height: 52px;
    --mg-expression-slot-padding: 2px 5px;
    --mg-expression-gap: 4px;
    --mg-expression-slot-radius: 10px;
    --mg-expression-slot-border-width: 2px;
  }
  .mg-shell-standard .mg-feedback-line,
  .mg-shell-standard .mg-help-copy,
  .mg-shell-standard .mg-toast-warm { font-size: 15px; }
  .mg-shell-standard .mg-card-column { gap: 8px; }
  .mg-shell-standard .mg-card-column > .mg-card-picture { max-height: 30vh; }
  .mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall { max-height: 40vh; }
}

@media (prefers-reduced-motion: reduce) {
  .mg-shell-standard :is(.mg-toast, .mg-fly, .mg-confetti, .mg-shake, .mg-chip-streak.mg-hot) {
    animation: none !important;
  }
  .mg-shell-standard :is(.mg-big-btn, .mg-tile) { transition: none !important; }
  .mg-shell-standard .mg-progress > i { transition: none !important; }
}

@keyframes mg-toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
@keyframes mg-fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.8; } }
@keyframes mg-fly { to { transform: translate(var(--dx), -140px) scale(1.4); opacity: 0; } }
@keyframes mg-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes mg-pulse { to { transform: scale(1.08); } }
/* Reproduced Game 106 surrounding frame for FACT GRID. Values and class
   names follow the pinned reference (outputs/game107-fable/control/
   reference106: src/engine/styles.css Standard Shell, src/factory/styles.css
   and the 106 numeric answer rule). The root checkout engine predates the
   Standard Shell, so these rules travel with the game. They only match a
   root carrying .mg-shell-standard and .mf-game, which this game sets. */

.fg-game {

@media (max-width: 560px) {

@media (max-width: 560px), (max-height: 500px) {

    linear-gradient(155deg, var(--mf-bg-a) 0%, #243d9f 48%, var(--mf-bg-b) 100%);
}

/* Header: the game name fits one line, down to the floor, never truncates. */

  --mg-hud-title-size: var(--mg-hud-title-max);
  font-size: var(--mg-hud-title-size);
  line-height: 1.35; overflow: hidden; white-space: nowrap; min-width: 0; text-overflow: clip;
}
.mg-shell-standard .mg-hud-title[data-hud-title-lines="2"] {

.mf-game .mg-hud-title { padding-inline: 0.15em; }
.mg-shell-standard .mg-chip-score { min-height: var(--mg-chip-box-height); }

/* Standard Shell v1 frame. */
.mg-shell-standard {
  --mg-standard-max-width: 920px;
  --mg-standard-gutter: 16px;
  --mg-standard-compact-gutter: 10px;
  --mg-standard-answer-shadow-depth: 6px;
  --mg-standard-answer-clearance: 60px;
  --mg-standard-answer-min-height: 104.85px;
  --mg-standard-answer-compact-min-height: 66.6px;
  --mg-standard-answer-narrow-min-height: 57.15px;
  --mg-standard-answer-landscape-height: 54px;
}
.mg-shell-standard .mg-hud,
.mg-shell-standard .mg-progress,
.mg-shell-standard .mg-stage {
  width: min(var(--mg-standard-max-width), calc(100% - (var(--mg-standard-gutter) * 2)));
  margin-left: auto;
  margin-right: auto;
}
.mg-shell-standard .mg-hud { padding: 10px 0; }
.mg-shell-standard .mg-chip { font-size: 18px; }
.mg-shell-standard .mg-progress { height: 10px; }
.mg-shell-standard .mg-stage {
  gap: 20px;
  padding: 10px 0 calc(var(--mg-standard-answer-clearance) + var(--mg-standard-answer-shadow-depth) + env(safe-area-inset-bottom, 0px));
}
.mg-shell-standard .mg-prompt { font-size: 28px; }
.mg-shell-standard .mg-visual { flex: 1 1 auto; }
.mg-shell-standard .mg-problem-card { flex: 1 1 auto; min-width: 0; min-height: 0; }
.mg-shell-standard .mg-tiles { width: min(686px, 85%); align-self: center; gap: 10.8px; }
.mg-shell-standard .mg-tile {
  min-height: var(--mg-standard-answer-min-height);
  font-size: clamp(24px, 4vw, 32px);
  box-shadow: 0 var(--mg-standard-answer-shadow-depth) 0 var(--mg-ink);
}
.mg-shell-standard .mg-tile:active { box-shadow: 0 2px 0 var(--mg-ink); }
.mg-shell-standard .mg-tile:focus-visible { outline: 4px solid #ffd93d; outline-offset: 3px; }
.mg-shell-standard .mg-feedback-line,
.mg-shell-standard .mg-help-copy,
.mg-shell-standard .mg-toast-warm { font-size: clamp(15px, 3vw, 28px); line-height: 1.1; }
.mg-shell-standard .mg-toast-good { font-size: clamp(45px, 9vw, 84px); line-height: 1.1; }
.mg-shell-standard .mg-help-panel { min-width: 0; }
.mg-shell-standard .mg-tag,
.mg-shell-standard .mg-hint { font-size: 15px; }

/* 106 numeric answer content. */
.mf-game .mf-answer-button { display: grid; place-items: center; }
.mf-game .mp-number-choice .mf-answer-content--number {
  display: block;
  color: var(--mf-ink);
  font-family: var(--mg-font-read);
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 700;
  line-height: .9;
}

/* Problem Card surface. */
.mf-game .mf-card {
  width: min(920px, 100%);
  height: 100%;
  max-height: 100%;
  min-width: 0;
  min-height: 0;
  padding: clamp(10px, 1.5vw, 16px);
  color: var(--mf-ink);
  background: var(--mf-card);
  border: 4px solid var(--mf-ink);
  border-radius: var(--mf-card-radius);
  box-shadow: var(--mf-card-shadow);
  text-align: center;
}

/* Start card: the example panel takes the family palette. */
.mf-game .mg-example { border-color: var(--mf-dotted-border); background: var(--mf-picture); margin-block: 8px; padding: 8px; }
.mg-shell-standard .mg-big-btn:focus-visible { outline: 4px solid #ffd93d; outline-offset: 4px; }

/* Retry control and popup frame. */
.mf-game .mf-retry {
  min-height: 44px;
  margin-top: 2px;
  padding: 7px 20px;
  color: var(--mf-ink);
  background: #ffd93d;
  border: 3px solid var(--mf-ink);
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--mf-ink);
  font-family: var(--mg-font-shout);
  font-size: clamp(18px, 2.2vw, 27px);
  letter-spacing: 1px;
  cursor: pointer;
}
.mf-game .mf-retry:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mf-ink); }
.mf-game .mf-retry:focus-visible { outline: 4px solid #ffd93d; outline-offset: 4px; }

.mf-game .mf-popup {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 4;
  display: grid;
  max-width: calc(100% - 32px);
  max-height: calc(100% - 32px);
  width: min(600px, calc(100% - 32px));
  align-content: center;
  justify-items: center;
  gap: clamp(8px, 1.8vh, 16px);
  padding: clamp(14px, 2vh, 20px) clamp(14px, 2vw, 24px);
  overflow-y: auto;
  color: var(--mf-ink);
  background: var(--mf-card);
  border: 4px solid var(--mf-ink);
  border-radius: 20px;
  box-shadow: 0 8px 0 var(--mf-ink);
  text-align: center;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  animation: mf-popup-in var(--mf-popup-enter-ms, 240ms) ease-out;
}
.mf-game .mf-popup-message { max-width: 30ch; margin: 0; font-weight: 800; font-size: var(--mf-popup-title-size); line-height: 1.15; }
.mf-game .mf-popup-content { font-weight: 700; display: grid; width: 100%; min-width: 0; justify-items: center; font-size: var(--mf-popup-body-size); line-height: 1.2; }
.mf-game .mf-popup--cue { padding-block: clamp(16px, 2.5vh, 24px); padding-inline: clamp(18px, 2.5vw, 30px); }
.mf-game .mf-popup--cue .mf-popup-message {
  width: 100%;
  max-width: 570px;
  padding-block: clamp(12px, 2vh, 18px);
  padding-inline: clamp(12px, 2vw, 24px);
  background: var(--mf-picture);
  border: 3px solid var(--mf-dotted-border);
  border-radius: 15px;
}
.mf-game .mf-popup--teaching { padding-block: clamp(16px, 2.5vh, 24px); padding-inline: clamp(18px, 2.5vw, 30px); }
.mf-game .mf-popup-content > p { max-width: 570px; margin: 0 0 10px; font-size: clamp(18px, 3vw, 25px); font-weight: 700; line-height: 1.16; text-align: center; }
.mf-game .fg-help-instruction { margin: 0 0 12px; }
.mf-game .fg-help-picture {
  width: 100%;
  min-height: 118px;
  display: grid;
  place-items: center;
  padding: clamp(12px, 2.5vh, 18px) 8px;
  background: var(--mf-picture);
  border: 3px solid var(--mf-dotted-border);
  border-radius: 15px;
}

@media (max-width: 560px) {
  .mg-shell-standard .mg-hud,
  .mg-shell-standard .mg-progress,
  .mg-shell-standard .mg-stage {
    width: min(var(--mg-standard-max-width), calc(100% - (var(--mg-standard-compact-gutter) * 2)));
  }
  .mg-shell-standard .mg-prompt { font-size: 20px; }
  .mg-shell-standard .mg-stage { gap: 14px; }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-compact-min-height); }
  .mf-game .mp-number-choice .mf-answer-content--number { font-size: 24px; }
  .mf-game .mf-card { padding: 8px; border-radius: 18px; }
  .mf-game .mf-popup { width: min(600px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 12px; }
  .mf-game .fg-help-picture { min-height: 92px; }
}
@media (max-width: 360px) and (max-height: 600px) {
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-narrow-min-height); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .mg-shell-standard .mg-stage { gap: 14px; padding-top: 4px; }
  .mg-shell-standard .mg-prompt { font-size: 20px; }
  .mg-shell-standard .mg-tiles { flex: 0 0 var(--mg-standard-answer-landscape-height); }
  .mg-shell-standard .mg-tiles[data-count="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-landscape-height); padding: 4px 10px; line-height: 1; }
  .mg-shell-standard .mg-toast-warm { font-size: 15px; }
  .mf-game .mf-card { padding: 4px; border-radius: 16px; }
  .mf-game .mf-popup { width: min(600px, calc(100% - 16px)); max-height: calc(100% - 16px); padding: 10px; }
  .mf-game .mf-popup-content > p { font-size: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .mg-shell-standard :is(.mg-toast, .mg-fly, .mg-confetti, .mg-shake, .mg-chip-streak.mg-hot) { animation: none !important; }
  .mg-shell-standard :is(.mg-big-btn, .mg-tile) { transition: none !important; }
  .mg-shell-standard .mg-progress > i { transition: none !important; }
  .mf-game .mf-popup { animation: none; }
  .mf-game .mf-retry { transition: none; }
}

@keyframes mf-popup-in {
  from { opacity: 0; transform: translate(-50%, -42%) scale(.9); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
/* FACT GRID Problem Card interior, robot and rewards. Everything is scoped
   to .fg-game. The surrounding frame lives in shell.css. */

.fg-game {
  --fg-red: #e5352b;
  --fg-red-dark: #b8241c;
  --fg-screen: #d7dbde;
  --fg-screen-line: #aeb6bc;
  --fg-head: #b9c2c9;
  --fg-mint: #7fe3d2;
  --fg-mint-deep: #2fb3a3;
  --fg-orange: #f29b38;
  --fg-yellow: #ffd93d;
  --fg-ink: #13213f;
  --fg-cream: #fff4d6;
}

.fg-announce {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
  clip-path: inset(50%); white-space: nowrap;
}

/* While no answer is possible (reward, decision, finished chart) the answer
   grid keeps its exact measured space but is invisible and inert, so the
   Problem Card never grows into the established answer area. */
.fg-game .mg-tiles.fg-tiles--parked { visibility: hidden; }
.fg-game .mg-tiles.fg-tiles--parked .mg-tile { pointer-events: none; }

/* Reduced motion: one static praise toast on a timer instead of the
   animated engine effects. */
.fg-game .fg-toast-static { animation: none !important; opacity: 1; transform: translate(-50%, -50%); }

/* ---------- Problem Card ---------- */
.fg-game .fg-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(200px, .9fr);
  grid-template-rows: minmax(0, 1fr);
  gap: clamp(8px, 1.4vw, 14px);
  overflow: hidden;
}

/* The drawing toy: red casing, gray screen, the chart etched on it. */
.fg-game .fg-toy {
  position: relative;
  container-type: size;
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 0;
}
/* The casing is a square that fits the smaller side of its cell, so the
   red frame always hugs the screen. */
.fg-game .fg-toy-shell {
  width: min(100cqw, 100cqh);
  height: min(100cqw, 100cqh);
  padding: 8px;
  background: linear-gradient(180deg, #f0473c, var(--fg-red) 55%, var(--fg-red-dark));
  border: 3px solid var(--fg-ink);
  border-radius: 20px;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, .28), inset 0 -4px 0 rgba(0, 0, 0, .22);
}
.fg-game .fg-toy-screen {
  position: relative;
  width: 100%;
  height: 100%;
  container-type: size;
  background: var(--fg-screen);
  border: 3px solid var(--fg-ink);
  border-radius: 10px;
  box-shadow: inset 0 0 0 3px #c4cacf, inset 0 4px 10px rgba(0, 0, 0, .18);
  overflow: hidden;
}
.fg-game .fg-chart {
  display: grid;
  grid-template-rows: repeat(calc(var(--fg-size) + 1), minmax(0, 1fr));
  width: 100%;
  height: 100%;
  padding: 2%;
  font-family: var(--mg-font-read);
  font-weight: 700;
  color: var(--fg-ink);
}
.fg-game .fg-chart-row { display: grid; grid-template-columns: repeat(calc(var(--fg-size) + 1), minmax(0, 1fr)); min-height: 0; }
.fg-game .fg-cell {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 0;
  font-size: max(8px, 5cqh);
  line-height: 1;
  border: 1px solid var(--fg-screen-line);
  margin: -0.5px;
  background: rgba(255, 255, 255, .28);
  transition: background .18s;
}
.fg-game .fg-cell > span { display: block; min-width: 0; }
.fg-game .fg-cell--corner { background: var(--fg-head); color: #4b5563; font-size: max(7px, 3.6cqh); }
.fg-game .fg-cell--head { background: var(--fg-head); color: var(--fg-ink); font-weight: 800; }
/* Highlighted families use an even mint fill without marker bars. */
.fg-game .fg-cell--head.fg-cell--family { background: var(--fg-mint); }
.fg-game .fg-cell--product.fg-cell--family { background: rgba(127, 227, 210, .38); }
/* Active row and column: brighter band plus a dotted trail. */
.fg-game .fg-cell--product.fg-cell--active-line { background: rgba(255, 217, 61, .48); }
.fg-game .fg-cell--product.fg-cell--active-line:not(.fg-cell--done)::before {
  content: ''; position: absolute; inset: 30%; border-radius: 50%; background: rgba(19, 33, 63, .18);
}
.fg-game .fg-cell--head.fg-cell--active-head { background: var(--fg-yellow); box-shadow: inset 0 0 0 2px var(--fg-ink); z-index: 1; }
/* The square being filled: yellow, outlined, with a question mark. */
.fg-game .fg-cell--target {
  z-index: 2;
  background: var(--fg-yellow);
  box-shadow: 0 0 0 2px var(--fg-ink), 0 0 0 5px rgba(255, 217, 61, .9);
  border-radius: 3px;
  font-size: max(9px, 5.4cqh);
  animation: fg-target-pulse 1.4s ease-in-out infinite;
}
.fg-game .fg-cell--target::before { display: none; }
@keyframes fg-target-pulse { 50% { box-shadow: 0 0 0 2px var(--fg-ink), 0 0 0 7px rgba(255, 217, 61, .55); } }
/* Completed squares: white with the product, so progress reads as numbers. */
.fg-game .fg-cell--done { background: #fff; color: var(--fg-ink); }
/* Given squares (row 1 and column 1): filled in from the start, quieter
   than the squares the child fills, never highlighted or targeted. */
.fg-game .fg-cell--given { background: #eef1f3; color: #5b6478; }
.fg-game .fg-cell--done.fg-cell--family { background: #f4fffc; }
.fg-game .fg-cell--just { animation: fg-cell-pop .5s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes fg-cell-pop { 0% { transform: scale(.4); background: var(--fg-yellow); } 60% { transform: scale(1.25); } 100% { transform: none; } }

/* Launchpad: the finished chart lights up row by row. */
.fg-game .fg-toy--launchpad .fg-cell--done { animation: fg-launch-glow 1.2s ease-in-out infinite; animation-delay: calc(var(--fg-r, 0) * 110ms); }
.fg-game .fg-chart-row:nth-child(2) { --fg-r: 9; } .fg-game .fg-chart-row:nth-child(3) { --fg-r: 8; }
.fg-game .fg-chart-row:nth-child(4) { --fg-r: 7; } .fg-game .fg-chart-row:nth-child(5) { --fg-r: 6; }
.fg-game .fg-chart-row:nth-child(6) { --fg-r: 5; } .fg-game .fg-chart-row:nth-child(7) { --fg-r: 4; }
.fg-game .fg-chart-row:nth-child(8) { --fg-r: 3; } .fg-game .fg-chart-row:nth-child(9) { --fg-r: 2; }
.fg-game .fg-chart-row:nth-child(10) { --fg-r: 1; } .fg-game .fg-chart-row:nth-child(11) { --fg-r: 0; }
@keyframes fg-launch-glow { 50% { background: var(--fg-yellow); box-shadow: 0 0 6px 2px rgba(255, 217, 61, .8); } }

/* ---------- side panel ---------- */
.fg-game .fg-side {
  container-type: inline-size;
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 6px;
  min-width: 0;
  min-height: 0;
}
.fg-game .fg-equation {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: clamp(4px, 1.6cqw, 10px);
  padding: 6px 4px 2px;
  font-family: var(--mg-font-read);
  font-weight: 700;
  color: var(--fg-ink);
}
.fg-game .fg-factor { display: grid; justify-items: center; gap: 2px; min-width: 2ch; }
.fg-game .fg-factor-value {
  display: grid; place-items: center;
  min-width: 1.6em; min-height: 1.3em; padding: 0 .2em;
  font-size: clamp(26px, 9cqw, 44px); line-height: 1.15;
  border-radius: 12px; border: 3px solid var(--fg-ink); background: #fff;
}
.fg-game .fg-factor i { font-style: normal; font-size: clamp(11px, 3.4cqw, 14px); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: #355080; }
.fg-game .fg-factor--row .fg-factor-value { border-color: var(--fg-mint-deep); background: #edfff9; }
.fg-game .fg-factor--col .fg-factor-value { border-color: var(--fg-mint-deep); background: #edfff9; }
.fg-game .fg-factor--product .fg-factor-value { border-style: dashed; background: var(--fg-yellow); }
.fg-game .fg-equation--filled .fg-factor--product .fg-factor-value { border-style: solid; background: #fff; animation: fg-cell-pop .5s cubic-bezier(.2, .9, .3, 1.3); }
.fg-game .fg-op { font-size: clamp(26px, 8cqw, 40px); line-height: 1.3; padding-top: .1em; }

.fg-game .fg-robot-stage {
  position: relative;
  min-height: 90px;
  min-width: 0;
  display: grid;
  place-items: end center;
  overflow: hidden;
  border-radius: 14px;
  background:
    linear-gradient(180deg, transparent 0 82%, rgba(19, 33, 63, .12) 82% 84%, transparent 84%),
    radial-gradient(ellipse at 50% 100%, rgba(127, 227, 210, .35), transparent 62%);
}
/* The robot stands on the stage floor with headroom above it: 10% in play
   so hops and the cartwheel stay inside the stage, 22% during a milestone
   so the jetpack loop fits. The hop and flight peaks are sized to that
   headroom. The final launch alone leaves the card on purpose. */
.fg-game .fg-robot { position: absolute; inset: 0; top: 10%; }
.fg-game .fg-card[data-scene] .fg-robot { top: 22%; }
.fg-game .fg-robot-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }

/* One player, one continuous journey from 0 to 100 percent. */
.fg-game .fg-completion { display: flex; align-items: center; gap: 8px; padding: 4px 8px; min-width: 0; }
.fg-game .fg-player-badge { flex: 0 0 58px; width: 58px; height: 58px; }
.fg-game .fg-player-badge svg { display: block; width: 100%; height: 100%; }
.fg-game .fg-completion-body { flex: 1; min-width: 0; }
.fg-game .fg-completion-label { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; margin-bottom: 4px; font-size: 12px; font-weight: 800; letter-spacing: .5px; color: var(--fg-ink); }
.fg-game .fg-completion-percent { font-size: 23px; line-height: 1; letter-spacing: 0; }
.fg-game .fg-completion-track { height: 16.5px; overflow: hidden; border: 3px solid var(--fg-ink); border-radius: 999px; background: #fff; }
.fg-game .fg-completion-track i { display: block; height: 100%; width: 0; background: var(--fg-mint-deep); border-radius: inherit; transition: width .5s ease-out; }

/* Sound toggle lives on the toy casing. */
.fg-game .fg-sound {
  position: absolute; top: 8px; right: 8px; z-index: 3;
  width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid var(--fg-ink); background: var(--fg-cream); box-shadow: 0 3px 0 var(--fg-ink);
  font-size: 20px; cursor: pointer; display: grid; place-items: center;
}
.fg-game .fg-sound:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--fg-ink); }
.fg-game .fg-sound:focus-visible { outline: 4px solid var(--fg-yellow); outline-offset: 2px; }

/* ---------- robot rig ---------- */
.fg-game .fg-robot-svg * { transform-box: view-box; }
.fg-game .fg-robot-rig { transform-origin: 70px 160px; }
.fg-game .fg-head { transform-origin: 70px 84px; }
.fg-game .fg-antenna { transform-origin: 70px 30px; }
.fg-game .fg-arm--left { transform-origin: 38px 94px; }
.fg-game .fg-arm--right { transform-origin: 102px 94px; }
.fg-game .fg-forearm--left { transform-origin: 15px 100px; }
.fg-game .fg-forearm--right { transform-origin: 125px 100px; }
.fg-game .fg-leg--left { transform-origin: 54px 128px; }
.fg-game .fg-leg--right { transform-origin: 86px 128px; }
.fg-game .fg-torso { transform-origin: 70px 128px; }
.fg-game .fg-skate { transform-origin: 70px 158px; opacity: 0; transform: scaleY(0); transition: opacity .3s, transform .4s cubic-bezier(.2, .9, .3, 1.4); }
.fg-game .fg-jetpack { transform-origin: 70px 100px; opacity: 0; transform: scale(.4); transition: opacity .3s, transform .4s cubic-bezier(.2, .9, .3, 1.4); }
.fg-game .fg-jet-flame { transform-origin: 70px 124px; opacity: 0; }
.fg-game .fg-holo { transform-origin: 15px 100px; opacity: 0; transform: scale(0); }
.fg-game .fg-bulb-glow { transition: opacity .4s; }
.fg-game .fg-robot--powered .fg-bulb-glow { opacity: .55; animation: fg-bulb 2.4s ease-in-out infinite; }
.fg-game .fg-robot--skates .fg-skate { opacity: 1; transform: none; }
.fg-game .fg-robot--jetpack .fg-jetpack { opacity: 1; transform: none; }
@keyframes fg-bulb { 50% { opacity: .2; } }

/* Expressions. */
.fg-game .fg-mouth-open, .fg-game .fg-mouth-oh, .fg-game .fg-mouth-hm { opacity: 0; }
.fg-game .fg-robot[data-mood="happy"] .fg-mouth-smile,
.fg-game .fg-robot[data-mood="joy"] .fg-mouth-smile,
.fg-game .fg-robot[data-mood="kind"] .fg-mouth-smile { opacity: 0; }
.fg-game .fg-robot[data-mood="happy"] .fg-mouth-open { opacity: 1; }
.fg-game .fg-robot[data-mood="joy"] .fg-mouth-oh { opacity: 1; }
.fg-game .fg-robot[data-mood="kind"] .fg-mouth-hm { opacity: 1; }
.fg-game .fg-robot[data-mood="joy"] .fg-pupil { transform: scale(1.3); transform-origin: center; transform-box: fill-box; }
.fg-game .fg-cheeks { opacity: 0; transition: opacity .3s; }
.fg-game .fg-robot[data-mood="joy"] .fg-cheeks, .fg-game .fg-robot[data-mood="happy"] .fg-cheeks { opacity: 1; }

/* Idle: a slow breath and a blink, away from the reading focus. */
.fg-game .fg-robot[data-perf=""] .fg-robot-rig { animation: fg-idle 3.2s ease-in-out infinite; }
.fg-game .fg-robot[data-perf=""] .fg-antenna { animation: fg-antenna-sway 3.2s ease-in-out infinite; }
.fg-game .fg-lid { animation: fg-blink 4.6s linear infinite; }
/* Hidden page: the root carries fg-inactive and every animation inside the
   game pauses (idle breath, antenna sway, blink, target pulse, scenes,
   fireworks, toasts). !important beats every animation shorthand that
   would otherwise reset the play state, whatever its specificity. */
.fg-game.fg-inactive, .fg-game.fg-inactive * { animation-play-state: paused !important; }
@keyframes fg-idle { 50% { transform: translateY(-2px); } }
@keyframes fg-antenna-sway { 50% { transform: rotate(-6deg); } }
@keyframes fg-blink { 0%, 92%, 100% { height: 0; } 95%, 97% { height: 19px; } }

/* ---------- correct-answer performances (about one second each) ---------- */
/* 1 Shuffle: side-to-side slide with alternating steps and swinging arms. */
.fg-game .fg-robot[data-perf="shuffle"] .fg-robot-rig { animation: fg-shuffle 1.1s ease-in-out; }
.fg-game .fg-robot[data-perf="shuffle"] .fg-leg--left { animation: fg-step-l 1.1s ease-in-out; }
.fg-game .fg-robot[data-perf="shuffle"] .fg-leg--right { animation: fg-step-r 1.1s ease-in-out; }
.fg-game .fg-robot[data-perf="shuffle"] .fg-arm--left { animation: fg-swing-l 1.1s ease-in-out; }
.fg-game .fg-robot[data-perf="shuffle"] .fg-arm--right { animation: fg-swing-r 1.1s ease-in-out; }
.fg-game .fg-robot[data-perf="shuffle"] .fg-head { animation: fg-head-bob 1.1s ease-in-out; }
/* The arms trail the slide (swing away from the direction of travel), so
   the leading hand never reaches past the stage edge on narrow stages. */
@keyframes fg-shuffle { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-3deg); } 50% { transform: translateX(0); } 75% { transform: translateX(10px) rotate(3deg); } }
@keyframes fg-step-l { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(-22deg) translateY(-4px); } 75% { transform: rotate(10deg); } }
@keyframes fg-step-r { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(22deg) translateY(-4px); } }
@keyframes fg-swing-l { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-35deg); } 75% { transform: rotate(35deg); } }
@keyframes fg-swing-r { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-35deg); } 75% { transform: rotate(35deg); } }
@keyframes fg-head-bob { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(6deg) translateY(2px); } 75% { transform: rotate(-6deg) translateY(2px); } }

/* 2 Heel-click hop: crouch, jump, kick both heels together, land with squash. */
.fg-game .fg-robot[data-perf="heelclick"] .fg-robot-rig { animation: fg-hop 1.05s cubic-bezier(.3, .6, .3, 1); }
.fg-game .fg-robot[data-perf="heelclick"] .fg-leg--left { animation: fg-kick-l 1.05s ease-in-out; }
.fg-game .fg-robot[data-perf="heelclick"] .fg-leg--right { animation: fg-kick-r 1.05s ease-in-out; }
.fg-game .fg-robot[data-perf="heelclick"] .fg-arm--left { animation: fg-arms-up-l 1.05s ease-in-out; }
.fg-game .fg-robot[data-perf="heelclick"] .fg-arm--right { animation: fg-arms-up-r 1.05s ease-in-out; }
@keyframes fg-hop { 0% { transform: none; } 18% { transform: scaleY(.86); } 45% { transform: translateY(-14px) scaleY(1.02); } 62% { transform: translateY(-11px); } 82% { transform: translateY(0) scaleY(.9); } 100% { transform: none; } }
@keyframes fg-kick-l { 0%, 25%, 80%, 100% { transform: rotate(0); } 45%, 60% { transform: rotate(-40deg) translateX(6px); } }
@keyframes fg-kick-r { 0%, 25%, 80%, 100% { transform: rotate(0); } 45%, 60% { transform: rotate(40deg) translateX(-6px); } }
@keyframes fg-arms-up-l { 0%, 100% { transform: rotate(0); } 40%, 70% { transform: rotate(150deg); } }
@keyframes fg-arms-up-r { 0%, 100% { transform: rotate(0); } 40%, 70% { transform: rotate(-150deg); } }

/* 3 Spin: a full turn on the spot, arms out, small hop. */
.fg-game .fg-robot[data-perf="spin"] .fg-robot-rig { animation: fg-spin 1.1s cubic-bezier(.4, 0, .3, 1); }
.fg-game .fg-robot[data-perf="spin"] .fg-arm--left { animation: fg-arms-out-l 1.1s ease-in-out; }
.fg-game .fg-robot[data-perf="spin"] .fg-arm--right { animation: fg-arms-out-r 1.1s ease-in-out; }
.fg-game .fg-robot[data-perf="spin"] .fg-antenna { animation: fg-antenna-whip 1.1s ease-in-out; }
@keyframes fg-spin { 0% { transform: scaleX(1); } 15% { transform: translateY(-6px) scaleX(1); } 40% { transform: translateY(-10px) scaleX(-1); } 65% { transform: translateY(-10px) scaleX(1); } 90% { transform: translateY(0) scaleX(-1); } 100% { transform: scaleX(1); } }
@keyframes fg-arms-out-l { 0%, 100% { transform: rotate(0); } 30%, 80% { transform: rotate(80deg); } }
@keyframes fg-arms-out-r { 0%, 100% { transform: rotate(0); } 30%, 80% { transform: rotate(-80deg); } }
@keyframes fg-antenna-whip { 30% { transform: rotate(18deg); } 60% { transform: rotate(-18deg); } }

/* 4 Fist pump: anticipation lean, a fast punch up, held, then release. */
.fg-game .fg-robot[data-perf="fistpump"] .fg-arm--right { animation: fg-pump 1s cubic-bezier(.2, .9, .3, 1.2); }
.fg-game .fg-robot[data-perf="fistpump"] .fg-forearm--right { animation: fg-pump-fore 1s ease-out; }
.fg-game .fg-robot[data-perf="fistpump"] .fg-robot-rig { animation: fg-pump-body 1s ease-in-out; }
.fg-game .fg-robot[data-perf="fistpump"] .fg-head { animation: fg-pump-head 1s ease-in-out; }
.fg-game .fg-robot[data-perf="fistpump"] .fg-leg--left { animation: fg-pump-leg 1s ease-in-out; }
@keyframes fg-pump { 0% { transform: rotate(0); } 20% { transform: rotate(30deg); } 40%, 75% { transform: rotate(-165deg); } 100% { transform: rotate(0); } }
@keyframes fg-pump-fore { 0%, 20% { transform: rotate(0); } 40%, 75% { transform: rotate(40deg); } 100% { transform: rotate(0); } }
@keyframes fg-pump-body { 0% { transform: none; } 20% { transform: scaleY(.94) rotate(4deg); } 40%, 75% { transform: translateY(-6px) rotate(-7deg); } 100% { transform: none; } }
@keyframes fg-pump-head { 40%, 75% { transform: rotate(-10deg); } }
@keyframes fg-pump-leg { 40%, 75% { transform: rotate(-20deg) translateY(-6px); } }

/* 5 Cartwheel: a full sideways wheel, limbs spread, landing settle. The
   wheel turns about the body's centre (not the floor pivot the other moves
   use), lifted a little at the top of the arc, so head, antenna, hands and
   feet all stay inside the stage through the whole turn. */
.fg-game .fg-robot[data-perf="cartwheel"] .fg-robot-rig { transform-origin: 70px 92px; animation: fg-cartwheel 1.25s cubic-bezier(.45, .05, .35, 1); }
.fg-game .fg-robot[data-perf="cartwheel"] .fg-arm--left { animation: fg-spread-l 1.25s ease-in-out; }
.fg-game .fg-robot[data-perf="cartwheel"] .fg-arm--right { animation: fg-spread-r 1.25s ease-in-out; }
.fg-game .fg-robot[data-perf="cartwheel"] .fg-leg--left { animation: fg-spread-leg-l 1.25s ease-in-out; }
.fg-game .fg-robot[data-perf="cartwheel"] .fg-leg--right { animation: fg-spread-leg-r 1.25s ease-in-out; }
@keyframes fg-cartwheel { 0% { transform: none; } 12% { transform: translateX(6px) rotate(-8deg); } 30% { transform: translateX(-2px) translateY(-12px) rotate(90deg) scale(.9); } 55% { transform: translateX(-4px) translateY(-24px) rotate(200deg); } 78% { transform: translateY(-6px) rotate(330deg); } 88% { transform: translateY(4px) rotate(360deg) scaleY(.94); } 100% { transform: translateX(0) rotate(360deg); } }
@keyframes fg-spread-l { 0%, 100% { transform: rotate(0); } 25%, 80% { transform: rotate(150deg); } }
@keyframes fg-spread-r { 0%, 100% { transform: rotate(0); } 25%, 80% { transform: rotate(-150deg); } }
@keyframes fg-spread-leg-l { 0%, 100% { transform: rotate(0); } 25%, 80% { transform: rotate(-35deg); } }
@keyframes fg-spread-leg-r { 0%, 100% { transform: rotate(0); } 25%, 80% { transform: rotate(35deg); } }

/* 6 Holo star: raises a hand and projects a spinning star. */
.fg-game .fg-robot[data-perf="star"] .fg-arm--left { animation: fg-present 1.2s cubic-bezier(.2, .9, .3, 1.2); }
.fg-game .fg-robot[data-perf="star"] .fg-holo { animation: fg-holo 1.2s ease-out; }
.fg-game .fg-robot[data-perf="star"] .fg-head { animation: fg-look-up 1.2s ease-in-out; }
.fg-game .fg-robot[data-perf="star"] .fg-robot-rig { animation: fg-lean 1.2s ease-in-out; }
@keyframes fg-present { 0% { transform: rotate(0); } 30%, 80% { transform: rotate(110deg); } 100% { transform: rotate(0); } }
@keyframes fg-holo { 0%, 25% { opacity: 0; transform: scale(0) rotate(0); } 45% { opacity: 1; transform: scale(1.25) rotate(90deg); } 80% { opacity: 1; transform: scale(1) rotate(360deg); } 100% { opacity: 0; transform: scale(.4) rotate(420deg); } }
@keyframes fg-look-up { 30%, 80% { transform: rotate(-8deg) translateY(-2px); } }
@keyframes fg-lean { 30%, 80% { transform: rotate(5deg); } }

/* Encouragement after a miss: a soft head tilt and a thumbs-up. */
.fg-game .fg-robot[data-perf="encourage"] .fg-head { animation: fg-tilt .9s ease-in-out; }
.fg-game .fg-robot[data-perf="encourage"] .fg-arm--right { animation: fg-thumb .9s ease-in-out; }
@keyframes fg-tilt { 30%, 70% { transform: rotate(9deg); } }
@keyframes fg-thumb { 30%, 70% { transform: rotate(-70deg); } }

/* ---------- milestone scenes ---------- */
/* During a milestone the progress meter yields its space to the banner (the
   strip keeps its layout, so nothing shifts) and the SKIP control sits in
   the strip's right end. The robot stage keeps its full height. */
.fg-game .fg-scene-banner {
  position: absolute; left: 0; right: 84px; bottom: 0; z-index: 3;
  display: grid; align-content: center; gap: 2px; min-height: 56px; padding: 2px 8px; pointer-events: none;
  opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s;
  text-align: center;
}
.fg-game .fg-card[data-scene] .fg-scene-banner { opacity: 1; transform: none; }
.fg-game .fg-card[data-scene] .fg-completion { visibility: hidden; }
.fg-game .fg-scene-title { font-family: var(--mg-font-shout); font-size: clamp(20px, 7cqw, 32px); letter-spacing: 2px; line-height: 1.05; color: var(--fg-ink); text-shadow: 3px 3px 0 var(--fg-yellow); }
.fg-game .fg-scene-line { font-size: clamp(12px, 3.4cqw, 15px); font-weight: 700; line-height: 1.15; color: #355080; }
.fg-game .fg-card[data-scene] .fg-robot-stage { background: radial-gradient(ellipse at 50% 100%, rgba(255, 217, 61, .45), rgba(127, 227, 210, .25) 50%, transparent 72%); }
/* The finale is the one scene that leaves its stage: the launch flies up
   over the rest of the Problem Card (the completed chart is the launchpad
   on a phone, the equation panel on a desktop) and exits at the card's own
   clipped edge. The stage stops clipping and paints above its neighbours;
   the fireworks layer keeps its own bounds. */
.fg-game .fg-card[data-scene="finale"] .fg-robot-stage { overflow: visible; z-index: 4; }
.fg-game .fg-skip {
  position: absolute; right: 0; bottom: 6px; z-index: 4;
  min-width: 64px; min-height: 44px; padding: 6px 16px;
  font-family: var(--mg-font-shout); font-size: 20px; letter-spacing: 1px;
  color: var(--fg-ink); background: var(--fg-cream); border: 3px solid var(--fg-ink); border-radius: 999px; box-shadow: 0 3px 0 var(--fg-ink); cursor: pointer;
}
.fg-game .fg-skip:focus-visible { outline: 4px solid var(--fg-yellow); outline-offset: 2px; }

/* 6: power-up. Antenna flares, eyes flash, then a stomping wave dance. */
.fg-game .fg-robot[data-perf="powerup"] .fg-bulb-glow { opacity: 1; animation: fg-flare 5.2s ease-in-out; }
.fg-game .fg-robot[data-perf="powerup"] .fg-bulb { animation: fg-bulb-pop 5.2s ease-in-out; }
.fg-game .fg-robot[data-perf="powerup"] .fg-robot-rig { animation: fg-powerup-body 5.2s ease-in-out; }
.fg-game .fg-robot[data-perf="powerup"] .fg-arm--left { animation: fg-wave-l 5.2s ease-in-out; }
.fg-game .fg-robot[data-perf="powerup"] .fg-arm--right { animation: fg-wave-r 5.2s ease-in-out; }
.fg-game .fg-robot[data-perf="powerup"] .fg-leg--left { animation: fg-stomp-l 5.2s ease-in-out; }
.fg-game .fg-robot[data-perf="powerup"] .fg-leg--right { animation: fg-stomp-r 5.2s ease-in-out; }
.fg-game .fg-robot[data-perf="powerup"] .fg-head { animation: fg-powerup-head 5.2s ease-in-out; }
@keyframes fg-flare { 0% { opacity: 0; transform: scale(.5); } 8%, 14% { opacity: 1; transform: scale(2.2); } 20% { opacity: .6; transform: scale(1); } 100% { opacity: .6; transform: scale(1); } }
@keyframes fg-bulb-pop { 6%, 12% { transform: scale(1.5); } }
@keyframes fg-powerup-body { 0%, 12% { transform: none; } 14% { transform: translateX(-3px); } 16% { transform: translateX(3px); } 18% { transform: translateX(-3px); } 20% { transform: none; } 26%, 42%, 58%, 74% { transform: translateY(-14px) rotate(-5deg); } 34%, 50%, 66% { transform: translateY(0) rotate(5deg); } 82% { transform: translateY(0); } 88% { transform: translateY(-22px) scaleY(1.06); } 94%, 100% { transform: translateY(0); } }
@keyframes fg-wave-l { 0%, 20% { transform: rotate(0); } 28%, 44%, 60%, 76% { transform: rotate(160deg); } 36%, 52%, 68% { transform: rotate(40deg); } 88%, 100% { transform: rotate(150deg); } }
@keyframes fg-wave-r { 0%, 20% { transform: rotate(0); } 28%, 44%, 60%, 76% { transform: rotate(-40deg); } 36%, 52%, 68% { transform: rotate(-160deg); } 88%, 100% { transform: rotate(-150deg); } }
@keyframes fg-stomp-l { 0%, 20%, 82%, 100% { transform: rotate(0); } 26%, 42%, 58%, 74% { transform: rotate(-30deg) translateY(-6px); } 34%, 50%, 66% { transform: rotate(0); } }
@keyframes fg-stomp-r { 0%, 20%, 82%, 100% { transform: rotate(0); } 34%, 50%, 66% { transform: rotate(30deg) translateY(-6px); } 26%, 42%, 58%, 74% { transform: rotate(0); } }
@keyframes fg-powerup-head { 0%, 20% { transform: none; } 26%, 58% { transform: rotate(8deg); } 42%, 74% { transform: rotate(-8deg); } 88%, 100% { transform: rotate(0) translateY(-3px); } }

/* 36: skates unfold, a glide left and right with a lean, one spin, a pose. */
.fg-game .fg-robot[data-perf="skate"] .fg-skate { opacity: 1; transform: none; animation: fg-skate-unfold 5.6s cubic-bezier(.2, .9, .3, 1.4); }
.fg-game .fg-robot[data-perf="skate"] .fg-wheel { animation: fg-wheel 5.6s linear; }
.fg-game .fg-robot[data-perf="skate"] .fg-robot-rig { animation: fg-glide 5.6s ease-in-out; }
.fg-game .fg-robot[data-perf="skate"] .fg-arm--left { animation: fg-glide-arm-l 5.6s ease-in-out; }
.fg-game .fg-robot[data-perf="skate"] .fg-arm--right { animation: fg-glide-arm-r 5.6s ease-in-out; }
.fg-game .fg-robot[data-perf="skate"] .fg-leg--right { animation: fg-glide-leg 5.6s ease-in-out; }
.fg-game .fg-robot[data-perf="skate"] .fg-head { animation: fg-glide-head 5.6s ease-in-out; }
@keyframes fg-skate-unfold { 0% { opacity: 0; transform: scaleY(0); } 12% { opacity: 1; transform: scaleY(1.2); } 18%, 100% { opacity: 1; transform: none; } }
@keyframes fg-wheel { 0%, 18% { transform: rotate(0); } 100% { transform: rotate(1440deg); } }
@keyframes fg-glide { 0%, 16% { transform: none; } 20% { transform: translateY(-6px) scaleY(.95); } 34% { transform: translateX(-38px) rotate(-12deg); } 50% { transform: translateX(34px) rotate(12deg); } 62% { transform: translateX(0) rotate(0) scaleX(1); } 68% { transform: translateY(-12px) scaleX(-1); } 74% { transform: translateY(-12px) scaleX(1); } 80% { transform: translateY(0) translateX(-24px) rotate(-8deg); } 90%, 100% { transform: translateX(0) rotate(0) translateY(-2px); } }
@keyframes fg-glide-arm-l { 0%, 16% { transform: rotate(0); } 34% { transform: rotate(60deg); } 50% { transform: rotate(-30deg); } 68%, 74% { transform: rotate(80deg); } 90%, 100% { transform: rotate(140deg); } }
@keyframes fg-glide-arm-r { 0%, 16% { transform: rotate(0); } 34% { transform: rotate(30deg); } 50% { transform: rotate(-60deg); } 68%, 74% { transform: rotate(-80deg); } 90%, 100% { transform: rotate(-20deg); } }
@keyframes fg-glide-leg { 0%, 16%, 62%, 100% { transform: rotate(0); } 34% { transform: rotate(35deg) translateY(-4px); } 50% { transform: rotate(-25deg); } 80% { transform: rotate(40deg) translateY(-6px); } }
@keyframes fg-glide-head { 34% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } 90%, 100% { transform: rotate(-4deg); } }

/* 64: jetpack ignites, lifts off, one loop, a hover wave, a soft landing.
   The flight turns about the body's centre (70, 92), not the floor pivot,
   so the loop never swings the head under the floor; the loop also shrinks
   a little so the antenna stays inside the stage sideways mid-turn. The
   crouch and landing squash are translated so the feet stay on the floor
   with the centred origin. Peaks are sized to the 22% scene headroom. */
.fg-game .fg-robot[data-perf="jetpack"] .fg-jetpack { opacity: 1; transform: none; animation: fg-jet-pop 6s cubic-bezier(.2, .9, .3, 1.4); }
.fg-game .fg-robot[data-perf="jetpack"] .fg-jet-flame { animation: fg-flame 6s ease-in-out; }
.fg-game .fg-robot[data-perf="jetpack"] .fg-robot-rig { transform-origin: 70px 92px; animation: fg-fly 6s ease-in-out; }
.fg-game .fg-robot[data-perf="jetpack"] .fg-arm--left { animation: fg-fly-arm-l 6s ease-in-out; }
.fg-game .fg-robot[data-perf="jetpack"] .fg-arm--right { animation: fg-fly-arm-r 6s ease-in-out; }
.fg-game .fg-robot[data-perf="jetpack"] .fg-leg--left { animation: fg-fly-leg-l 6s ease-in-out; }
.fg-game .fg-robot[data-perf="jetpack"] .fg-leg--right { animation: fg-fly-leg-r 6s ease-in-out; }
.fg-game .fg-robot[data-perf="jetpack"] .fg-robot-shadow { animation: fg-shadow-shrink 6s ease-in-out; }
@keyframes fg-jet-pop { 0% { opacity: 0; transform: scale(.4); } 10% { opacity: 1; transform: scale(1.15); } 15%, 100% { opacity: 1; transform: none; } }
@keyframes fg-flame { 0%, 12% { opacity: 0; transform: scaleY(.2); } 16% { opacity: 1; transform: scaleY(1.4); } 20%, 84% { opacity: 1; transform: scaleY(1); } 22%, 50%, 70% { transform: scaleY(1.3) scaleX(.9); } 92%, 100% { opacity: 0; transform: scaleY(.2); } }
@keyframes fg-fly { 0%, 14% { transform: none; } 17% { transform: translateY(8px) scaleY(.9) scaleX(1.06); } 28% { transform: translateY(-32px) rotate(-6deg); } 40% { transform: translateY(-36px) translateX(8px) rotate(6deg); } 52% { transform: translateY(-46px) translateX(0) rotate(180deg) scale(.8); } 62% { transform: translateY(-36px) translateX(-8px) rotate(360deg); } 74% { transform: translateY(-30px) translateX(0) rotate(354deg); } 86% { transform: translateY(-10px) rotate(360deg); } 90% { transform: translateY(8px) scaleY(.9) scaleX(1.06) rotate(360deg); } 100% { transform: rotate(360deg); } }
@keyframes fg-fly-arm-l { 0%, 14% { transform: rotate(0); } 28%, 74% { transform: rotate(120deg); } 86%, 100% { transform: rotate(20deg); } }
@keyframes fg-fly-arm-r { 0%, 14% { transform: rotate(0); } 28%, 74% { transform: rotate(-120deg); } 86%, 100% { transform: rotate(-20deg); } }
@keyframes fg-fly-leg-l { 0%, 14% { transform: rotate(0); } 28%, 74% { transform: rotate(-18deg); } 86%, 100% { transform: rotate(0); } }
@keyframes fg-fly-leg-r { 0%, 14% { transform: rotate(0); } 28%, 74% { transform: rotate(18deg); } 86%, 100% { transform: rotate(0); } }
@keyframes fg-shadow-shrink { 0%, 14%, 90%, 100% { transform: none; opacity: 1; } 28%, 74% { transform: scale(.5); opacity: .5; } }

/* 100: the biggest dance, a crouch, a launch up out of the card, fireworks. */
.fg-game .fg-robot[data-perf="finale"] .fg-jetpack { opacity: 1; transform: none; }
.fg-game .fg-robot[data-perf="finale"] .fg-jet-flame { animation: fg-finale-flame 8.2s ease-in-out forwards; }
.fg-game .fg-robot[data-perf="finale"] .fg-robot-rig { animation: fg-finale 8.2s ease-in-out forwards; }
.fg-game .fg-robot[data-perf="finale"] .fg-arm--left { animation: fg-finale-arm-l 8.2s ease-in-out forwards; }
.fg-game .fg-robot[data-perf="finale"] .fg-arm--right { animation: fg-finale-arm-r 8.2s ease-in-out forwards; }
.fg-game .fg-robot[data-perf="finale"] .fg-leg--left { animation: fg-stomp-l 3.6s ease-in-out; }
.fg-game .fg-robot[data-perf="finale"] .fg-leg--right { animation: fg-stomp-r 3.6s ease-in-out; }
.fg-game .fg-robot[data-perf="finale"] .fg-head { animation: fg-powerup-head 3.6s ease-in-out; }
.fg-game .fg-robot[data-perf="finale"] .fg-bulb-glow { opacity: 1; animation: fg-bulb .5s ease-in-out infinite; }
.fg-game .fg-robot[data-perf="finale"] .fg-robot-shadow { animation: fg-finale-shadow 8.2s ease-in-out forwards; }
/* The launch goes around the solved equation, never through it. After the
   crouch (56%) the whole robot box slides a fixed pixel distance to the
   left, out from under the factor boxes, while the rig stays low and banks
   into the move; only once it sits in that clear lane beside the equation
   does the rig climb, shrinking a little as it goes, and leave through the
   card's top edge. The lane is measured in pixels on the robot box because
   the equation is laid out in pixels while the rig's own unit scale changes
   with the stage height; the climb stays in viewBox units so it always
   clears the card. On a desktop the lane sits in the cream to the left of
   the ROW box (over the chart's edge on tall or narrow layouts); on a phone
   it is the margin left of the ROW box, so the rig also shrinks first to
   keep its head under the equation's labels during the slide, then drifts
   back over the lit chart as it exits. */
.fg-game .fg-robot { --fg-lane: -215px; }
.fg-game .fg-robot[data-perf="finale"] { animation: fg-finale-lane 8.2s ease-in-out forwards; }
@keyframes fg-finale-lane { 0%, 58% { transform: translateX(0); } 68%, 100% { transform: translateX(var(--fg-lane)); } }

@keyframes fg-finale-phone { 0% { transform: none; } 8%, 24% { transform: translateY(-14px) rotate(-6deg); } 16%, 32% { transform: translateY(0) rotate(6deg); } 36% { transform: translateY(-8px) scaleX(-1); } 40% { transform: translateY(-8px) scaleX(1); } 44% { transform: translateY(0); } 50% { transform: scaleY(.8) scaleX(1.12); } 54% { transform: scaleY(.78) scaleX(1.14) translateX(-2px); } 56% { transform: scaleY(.78) scaleX(1.14) translateX(2px); } 60% { transform: translate(0, -10px) rotate(0) scale(.85); } 68% { transform: translate(0, -14px) rotate(-8deg) scale(.7); } 78% { transform: translate(0, -250px) rotate(-2deg) scale(.62); } 90% { transform: translate(0, -430px) rotate(6deg) scale(.55); } 100% { transform: translate(0, -560px) rotate(8deg) scale(.5); } }

@keyframes fg-finale-arm-l { 0% { transform: rotate(0); } 8%, 24% { transform: rotate(160deg); } 16%, 32% { transform: rotate(40deg); } 50% { transform: rotate(-20deg); } 60%, 100% { transform: rotate(170deg); } }

.fg-game .fg-fireworks { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.fg-game .fg-card[data-scene="finale"] .fg-firework { animation-delay: calc(var(--fg-delay) + 3s); }

/* End screen robot in its earned gear. */
.fg-game .fg-end-robot { display: grid; place-items: center; height: 120px; }

.fg-game .fg-robot[data-perf="end-pose"] .fg-arm--right { transform: rotate(-30deg); }
.fg-game .fg-robot[data-perf="finale-pose"] .fg-arm--left { transform: rotate(160deg); }
.fg-game .fg-robot[data-perf="finale-pose"] .fg-arm--right { transform: rotate(-160deg); }

/* ---------- start screen lesson ---------- */
.fg-game .fg-start-icon { display: grid; place-items: center; }
.fg-game .fg-start-icon svg { width: 64px; height: 64px; }
.fg-game .fg-intro { display: grid; gap: 8px; color: var(--fg-ink); text-align: left; }
.fg-game .fg-intro-steps { display: grid; gap: 6px; margin: 0; padding: 0 2px; list-style: none; font-size: 17px; font-weight: 700; line-height: 1.2; }
.fg-game .fg-intro-steps li { display: flex; align-items: center; gap: 8px; }
.fg-game .fg-step-num { flex: 0 0 26px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--fg-ink); font-size: 14px; background: var(--fg-mint); }
.fg-game .fg-intro-steps li:nth-child(2) .fg-step-num { background: var(--fg-yellow); }
.fg-game .fg-intro-steps li:nth-child(3) .fg-step-num { background: #cdb4ff; }
.fg-game .fg-intro-chart { display: grid; width: min(230px, 100%); margin-inline: auto; padding: 6px; background: var(--fg-screen); border: 3px solid var(--fg-ink); border-radius: 10px; box-shadow: inset 0 0 0 3px #c4cacf; }
.fg-game .fg-intro-row { display: grid; grid-template-columns: repeat(5, 1fr); }
.fg-game .fg-intro-cell { position: relative; display: grid; place-items: center; height: 30px; margin: -0.5px; border: 1px solid var(--fg-screen-line); background: rgba(255, 255, 255, .28); font-size: 16px; font-weight: 800; }
.fg-game .fg-intro-cell--corner, .fg-game .fg-intro-cell--head { background: var(--fg-head); }
.fg-game .fg-intro-cell--row, .fg-game .fg-intro-cell--col { background: var(--fg-mint); }

.fg-game .fg-intro-answer { position: absolute; inset: 0; display: grid; place-items: center; background: #fff; opacity: 0; border-radius: 3px; }

.fg-game .fg-intro-eq-slot { display: inline-grid; vertical-align: baseline; }

.fg-game .fg-intro-eq-q, .fg-game .fg-intro-eq-p, .fg-game .fg-intro-unknown, .fg-game .fg-intro-answer { opacity: 0; }
.fg-game .fg-intro-unknown { opacity: 1; }
/* The lesson plays once: row lights, column lights, the square asks, the
   product fills. Settled state: the filled chart and the finished equation. */
.fg-game .fg-intro:not(.fg-intro--settled) .fg-intro-cell--row,
.fg-game .fg-intro:not(.fg-intro--settled) .fg-intro-cell--in-row { animation: fg-intro-light 6.5s ease-out both; }
.fg-game .fg-intro:not(.fg-intro--settled) .fg-intro-cell--col,

.fg-game .fg-intro:not(.fg-intro--settled) .fg-intro-eq-q,
.fg-game .fg-intro:not(.fg-intro--settled) .fg-intro-unknown { animation: fg-intro-ask 6.5s ease-out both; }

.fg-game .fg-intro-cell--row, .fg-game .fg-intro-cell--col { --fg-lit: var(--fg-mint); }
.fg-game .fg-intro-cell--in-row, .fg-game .fg-intro-cell--in-col { --fg-lit: rgba(255, 217, 61, .45); }
@keyframes fg-intro-light { 0%, 8% { background: rgba(255, 255, 255, .28); } 20%, 100% { background: var(--fg-lit); } }
@keyframes fg-intro-target { 0%, 26% { box-shadow: none; background: rgba(255, 217, 61, .45); } 36%, 100% { box-shadow: 0 0 0 2px var(--fg-ink); background: var(--fg-yellow); } }

.fg-game .fg-start-actions { display: grid; justify-items: center; gap: 8px; }

/* ---------- continuation choices ---------- */

/* ---------- responsive ---------- */
@media (max-width: 560px) {

  .fg-game .fg-equation { grid-column: 1 / -1; padding: 2px 46px 0; }

  .fg-game .fg-card[data-scene] .fg-robot-stage { grid-column: 1; }

     jetpack flight stay inside the stage; the robot is still larger than

  .fg-game .fg-card[data-scene] .fg-robot { bottom: 48px; top: 22%; }
  /* Phone launch: the lane is the margin left of the ROW box, the rig

  .fg-game .fg-jump { min-width: 48px; padding: 4px 8px 2px; }
  .fg-game .fg-intro-cell { height: 26px; font-size: 14px; }
  .fg-game .fg-intro-equation { font-size: 26px; }
  .fg-game .fg-robot--end { height: 96px; width: 96px; }
  .fg-game .fg-end-robot { height: 96px; }
}
