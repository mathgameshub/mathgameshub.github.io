  --mg-standard-max-width: 920px;
  --mg-standard-gutter: 16px;
  --mg-standard-compact-gutter: 10px;
  --mg-standard-answer-shadow-depth: 6px;
  --mg-standard-answer-clearance: 60px;
  --mg-standard-answer-min-height: 104.85px;
  --mg-standard-answer-compact-min-height: 66.6px;
  --mg-standard-answer-narrow-min-height: 57.15px;
  --mg-standard-answer-landscape-height: 54px;
  /* Expression row. Sizes come from the ML 1.04 original: the label is a
     small line over a big value, and the value always leads. Games set
     colours only, through the --mg-expression-slot-* properties below. */
  --mg-expression-label-size: 32px;
  --mg-expression-value-size: clamp(26px, 5vw, 38px);
  --mg-expression-operator-size: 42px;
  --mg-expression-slot-min-height: 92px;
  --mg-expression-slot-padding: 6px 10px;
  --mg-expression-gap: 8px;
  --mg-expression-slot-radius: 12px;
  --mg-expression-slot-border-width: 3px;
  --mg-expression-slot-border-color: var(--mg-ink);
  --mg-expression-slot-bg: transparent;
  --mg-expression-slot-bg-filled: var(--mg-expression-slot-bg);
}
.mg-shell-standard .mg-hud,
.mg-shell-standard .mg-progress,
.mg-shell-standard .mg-stage {
  width: min(var(--mg-standard-max-width), calc(100% - (var(--mg-standard-gutter) * 2)));
  margin-left: auto;
  margin-right: auto;
}
.mg-shell-standard .mg-hud { padding: 10px 0; }
.mg-shell-standard .mg-hud-title { font-size: var(--mg-hud-title-size); }
.mg-shell-standard .mg-chip { font-size: 18px; }
.mg-shell-standard .mg-progress { height: 10px; }
.mg-shell-standard .mg-stage {
  gap: 20px;
  padding: 10px 0 calc(var(--mg-standard-answer-clearance) + var(--mg-standard-answer-shadow-depth) + env(safe-area-inset-bottom, 0px));
}
.mg-shell-standard .mg-prompt { font-size: 28px; }
.mg-shell-standard .mg-visual { flex: 1 1 auto; }
.mg-shell-standard .mg-problem-card {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}
.mg-shell-standard .mg-problem-card .mg-expression-row { min-width: 0; }
.mg-shell-standard .mg-tiles {
  width: min(686px, 85%);
  align-self: center;
  gap: 10.8px;
}
.mg-shell-standard .mg-tile {
  min-height: var(--mg-standard-answer-min-height);
  font-size: clamp(24px, 4vw, 32px);
  box-shadow: 0 var(--mg-standard-answer-shadow-depth) 0 var(--mg-ink);
}
.mg-shell-standard .mg-tile:active { box-shadow: 0 2px 0 var(--mg-ink); }

/* Semantic content classes. Games own their content layout and add these
   alongside local class names to receive the shared type floors. */
/* No :where() here: the shell's type declarations must beat a game's local
   class on specificity, so these carry the full .mg-shell-standard .mg-class
   weight and win over a single game class. */
.mg-shell-standard :is(.mg-problem-body, .mg-card-stem) {
  font-size: 32px;
  line-height: 1.3;
}
/* An instruction stem inside the problem card is story copy: `.mg-card-stem`
   is typed identically to `.mg-problem-body` at every breakpoint, so a stem
   reads at the story size in the card's own ink colour. */
/* The same rule outside the Standard Shell, where the card is the prompt
   itself: the stem takes the story's own size, weight and colour by
   inheriting them, and drops to the shell's 15px story floor on compact
   widths so two sentences still hold two lines on a phone. The Standard
   Shell rules above and below outrank this on specificity, so they keep
   their own sizes. */
.mg-card-stem { font-size: inherit; font-weight: inherit; color: inherit; }
@media (max-width: 560px) {
  .mg-card-stem { font-size: 15px; }
}
/* Expression row: slots across the card, each a small label line over a big
   value line, with the operator between. The unknown slot is dashed. The
   value line reserves its height so the geometry never shifts. */
.mg-shell-standard .mg-expression-row {
  display: flex;
  align-items: stretch;
  justify-content: center;
  min-width: 0;
  gap: var(--mg-expression-gap);
}
.mg-shell-standard .mg-expression-slot {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  align-content: center;
  justify-items: center;
  row-gap: 2px;
  min-height: var(--mg-expression-slot-min-height);
  padding: var(--mg-expression-slot-padding);
  border: var(--mg-expression-slot-border-width) solid var(--mg-expression-slot-border-color);
  border-radius: var(--mg-expression-slot-radius);
  background: var(--mg-expression-slot-bg-filled);
}
.mg-shell-standard .mg-expression-slot--unknown {
  border-style: dashed;
  background: var(--mg-expression-slot-bg);
}
.mg-shell-standard .mg-expression-label {
  max-width: 100%;
  font-family: var(--mg-font-read);
  font-size: var(--mg-expression-label-size);
  font-weight: 700;
  line-height: var(--mg-expression-label-line-height, 1.05);
}
.mg-shell-standard .mg-expression-value {
  display: flex;
  align-items: baseline;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 0.18em;
  max-width: 100%;
  min-height: 1.15em;
  font-family: var(--mg-font-shout);
  font-size: var(--mg-expression-value-size);
  font-weight: 400;
  line-height: var(--mg-expression-value-line-height, 1.15);
}
.mg-shell-standard .mg-expression-row--readable-numerals .mg-expression-value {
  font-family: var(--mg-font-read);
  font-weight: 700;
}
.mg-shell-standard .mg-expression-value .mg-expression-operator { font-size: 1em; }
.mg-shell-standard .mg-expression-operator {
  align-self: center;
  font-family: var(--mg-font-shout);
  font-size: var(--mg-expression-operator-size);
  font-weight: 400;
  line-height: 1.15;
}
.mg-shell-standard .mg-feedback-line,
.mg-shell-standard .mg-help-copy,
.mg-shell-standard .mg-toast-warm {
  font-size: clamp(15px, 3vw, 28px);
  line-height: 1.1;
}
.mg-shell-standard .mg-toast-good { line-height: 1.1; }
.mg-shell-standard .mg-feedback-line {
  font-family: var(--mg-font-read);
  font-weight: 700;
  min-height: 31px;
  overflow: hidden;
}
.mg-shell-standard .mg-feedback-line:empty { visibility: hidden; }
.mg-shell-standard .mg-help-panel { min-width: 0; }
.mg-shell-standard .mg-kid-label:not(.mg-expression-label):not(.mg-expression-value):not(.mg-expression-operator),
.mg-shell-standard .mg-stat {
  font-size: max(15px, 1em);
}
.mg-shell-standard .mg-tag,
.mg-shell-standard .mg-hint {
  font-size: 15px;
}

/* Problem card interior + Expression row. Opt in with `mg-card-column` on the
   problem card (and `mg-card-picture` on its picture child), paired with
   `mg-expression-row` on equation rows. The shell owns every value below; a
   game overrides nothing. 103 and 104 do not opt in, so these selectors never
   match their DOM. Values track docs/game-guidelines.md. */
.mg-shell-standard .mg-card-column {
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 12px; /* floor, normal; space-evenly grows gaps equally above it */
}
.mg-shell-standard .mg-card-column > .mg-card-picture {
  max-height: 40vh; /* normal; keeps the picture from absorbing the slack */
  min-height: 0;
}
.mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall {
  max-height: 55vh;
}
/* Ceiling: on tall viewports the even share would exceed 32px, so stop
   stretching, let the card size to its content, and centre it in the stage. */
@media (min-height: 900px) {
  .mg-shell-standard .mg-card-column {
    flex: 0 1 auto;
    height: auto;
    margin-top: auto;
    margin-bottom: auto;
  }
}

@media (max-width: 560px) {
  .mg-shell-standard .mg-hud,
  .mg-shell-standard .mg-progress,
  .mg-shell-standard .mg-stage {
    width: min(var(--mg-standard-max-width), calc(100% - (var(--mg-standard-compact-gutter) * 2)));
  }
  .mg-shell-standard .mg-prompt { font-size: 20px; }
  .mg-shell-standard .mg-stage { gap: 14px; }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-compact-min-height); }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem) { font-size: 18px; line-height: 1.3; }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem).mg-problem-body--fit2 { font-size: 15px; }
  .mg-shell-standard {
    --mg-expression-label-size: 18px;
    --mg-expression-value-size: 31.5px;
    --mg-expression-operator-size: 37.8px;
    --mg-expression-slot-min-height: 68px;
    --mg-expression-slot-padding: 4px 6px;
    --mg-expression-gap: 6px;
    --mg-expression-slot-radius: 10px;
    --mg-expression-slot-border-width: 2px;
  }
  .mg-shell-standard .mg-card-column { gap: 8px; }
  .mg-shell-standard .mg-card-column > .mg-card-picture { max-height: 30vh; }
  .mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall { max-height: 40vh; }
}

@media (max-width: 360px) and (max-height: 600px) {
  .mg-shell-standard {
    --mg-expression-label-size: 15px;
    --mg-expression-value-size: 26px;
    --mg-expression-operator-size: 30px;
    --mg-expression-slot-min-height: 52px;
    --mg-expression-slot-padding: 2px 4px;
    --mg-expression-gap: 4px;
  }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-narrow-min-height); }
}

@media (orientation: landscape) and (max-height: 500px) {
  .mg-shell-standard .mg-stage { gap: 14px; padding-top: 4px; }
  .mg-shell-standard .mg-prompt { font-size: 20px; }
  .mg-shell-standard .mg-tiles { flex: 0 0 var(--mg-standard-answer-landscape-height); }
  .mg-shell-standard .mg-tiles[data-count="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-landscape-height); padding: 4px 10px; line-height: 1; }
  .mg-card-stem { font-size: 15px; }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem) { font-size: 15px; line-height: 1.1; }
  .mg-shell-standard {
    --mg-expression-label-size: 15px;
    --mg-expression-value-size: 31.5px;
    --mg-expression-operator-size: 37.8px;
    --mg-expression-slot-min-height: 52px;
    --mg-expression-slot-padding: 2px 5px;
    --mg-expression-gap: 4px;
    --mg-expression-slot-radius: 10px;
    --mg-expression-slot-border-width: 2px;
  }
  .mg-shell-standard .mg-feedback-line,
  .mg-shell-standard .mg-help-copy,
  .mg-shell-standard .mg-toast-warm { font-size: 15px; }
  .mg-shell-standard .mg-card-column { gap: 8px; }
  .mg-shell-standard .mg-card-column > .mg-card-picture { max-height: 30vh; }
  .mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall { max-height: 40vh; }
}

@media (prefers-reduced-motion: reduce) {
  .mg-shell-standard :is(.mg-toast, .mg-fly, .mg-confetti, .mg-shake, .mg-chip-streak.mg-hot) {
    animation: none !important;
  }
  .mg-shell-standard :is(.mg-big-btn, .mg-tile) { transition: none !important; }
  .mg-shell-standard .mg-progress > i { transition: none !important; }
}

@keyframes mg-toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
@keyframes mg-fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.8; } }
@keyframes mg-fly { to { transform: translate(var(--dx), -140px) scale(1.4); opacity: 0; } }
@keyframes mg-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes mg-pulse { to { transform: scale(1.08); } }
/* Factory pieces are opt in. The engine remains the owner of its shared
   header, prompt, answer grid and screen geometry. */

.mf-game {
  --mf-picture-border: var(--mf-ink);
  --mf-card-radius: 22px;
  --mf-card-shadow: 0 6px 0 var(--mf-ink);
  --mf-card-gap: 12px;
  --mf-content-size: clamp(16px, min(3vw, 6vh), 32px);
}

.mf-game[data-mf-theme="creature"] {
  background:
    radial-gradient(ellipse 180px 74px at 7% 105%, #3fae5c 0 48%, transparent 49%),
    radial-gradient(ellipse 220px 92px at 30% 108%, #64d477 0 48%, transparent 49%),
    radial-gradient(ellipse 190px 78px at 68% 106%, #3fae5c 0 48%, transparent 49%),
    radial-gradient(ellipse 210px 88px at 95% 108%, #64d477 0 48%, transparent 49%),
    linear-gradient(180deg, var(--mf-bg-a) 0%, var(--mf-good) 42%, var(--mf-bg-b) 100%);
}

.mf-game[data-mf-theme="robot"] {
  background:
    radial-gradient(circle at 12% 18%, rgba(55, 200, 197, .22) 0 8%, transparent 9%),
    radial-gradient(circle at 88% 80%, rgba(242, 155, 56, .24) 0 12%, transparent 13%),
    linear-gradient(155deg, var(--mf-bg-a) 0%, #243d9f 48%, var(--mf-bg-b) 100%);
}

.mf-game .mf-card {
  width: min(920px, 100%);
  height: 100%;
  max-height: 100%;
  min-width: 0;
  min-height: 0;
  padding: clamp(10px, 1.5vw, 16px);
  color: var(--mf-ink);
  background: var(--mf-card);
  border: 4px solid var(--mf-ink);
  border-radius: var(--mf-card-radius);
  box-shadow: var(--mf-card-shadow);
  text-align: center;
}

.mf-game .mf-statement {
  min-width: 0;
  min-height: 0;
  margin: 0;
  color: var(--mf-ink);
  font-weight: 700;
}

.mf-game .mf-statement p {
  margin: 0;
}

.mf-game .mf-statement p + p {
  margin-top: 8px;
}

.mf-game .mf-statement--framed {
  display: grid;
  align-content: center;
  padding: 9px 12px;
  background: var(--mf-picture-alt);
  border: 3px dashed var(--mf-bg-a);
  border-radius: 14px;
}

.mf-game .mf-group-display,
.mf-game .mf-counting-cue {
  position: relative;
  display: grid;
  min-width: 0;
  min-height: 0;
  place-items: center;
  overflow: hidden;
  padding: 6px 8px;
  background: var(--mf-picture);
  border: 3px solid var(--mf-picture-border);
  border-radius: 16px;
}

.mf-game .mf-group-art,
.mf-game .mf-counting-cue-art {
  position: relative;
  display: grid;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  place-items: center;
}

.mf-game .mf-group-art .cc-patch {
  display: block;
  width: 100%;
  height: 100%;
}

.mf-game .mf-group-art .cc-bush-leaf {
  fill: #64d477;
  stroke: var(--mf-ink);
  stroke-width: 3;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.mf-game .mf-group-art .cc-bush-shade {
  fill: #3fae5c;
  opacity: 0.55;
}

.mf-game .mf-group-art :is(.cc-bush-leaf, .cc-bush-shade) {
  transform: scale(1.08);
  transform-box: fill-box;
  transform-origin: 50% 50%;
}

.mf-game .mf-unknown-badge {
  position: absolute;
  left: 50%;
  top: 50%;
  display: grid;
  min-width: 44px;
  min-height: 44px;
  place-items: center;
  color: var(--mf-ink);
  background: var(--mf-accent);
  border: 3px solid var(--mf-ink);
  border-radius: 50%;
  box-shadow: 0 3px 0 var(--mf-ink);
  transform: translate(-50%, -50%);
  font-family: var(--mg-font-shout);
  font-size: 32px;
  line-height: 1;
}

/* The 103 picture plus centered two-factor arrangement. The operator stays
   in the middle, while the larger box is centered in its half and the smaller
   box mirrors its inner edge. */
.mf-game .mf-card--groups-times {
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 0;
  padding-block: 0;
}

.mf-game .mf-card--groups-times > .mf-group-display {
  width: 100%;
  height: clamp(90px, 20vh, 240px);
  max-height: calc(100% - 84px);
  flex: 0 1 auto;
}

/* 103's drawing is an open patch on the card. The source example and play
   card do not add a second picture panel around the approved SVG. */
.mf-game .mf-card--groups-times > .mf-group-display,
.mf-game .mf-start-lesson.mf-composition--groups-times > .mf-group-display {
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
}

.mf-game .mf-card--groups-times > .mf-factor-row {
  flex: 0 0 auto;
}

/* 103's textual alternative keeps the statement and the same narrow factor
   row without introducing an illustration. */
.mf-game .mf-card--statement-times {
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 0;
}

.mf-game .mf-card--statement-times > .mf-statement {
  display: grid;
  align-content: center;
  flex: 1 1 auto;
  padding: clamp(10px, 1.5vw, 16px);
  background: var(--mf-picture);
  border: 3px dashed var(--mf-bg-a);
  border-radius: 16px;
}

.mf-game .mf-card--statement-times > .mf-factor-row {
  flex: 0 0 auto;
}

/* 104 retains its statement, countable picture and taller equals row. */
.mf-game .mf-card--story-groups-equals {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(min-content, 2fr) minmax(30px, 3fr) auto;
  align-items: stretch;
  gap: 10px;
}

.mf-game .mf-card--story-groups-equals > .mf-statement {
  display: grid;
  align-content: center;
  min-height: 0;
  padding-block: 4px;
}

.mf-game .mf-card--story-groups-equals > .mf-statement p + p {
  margin-top: 0;
}

.mf-game .mf-card--story-groups-equals > .mf-group-display {
  height: 100%;
  min-height: 30px;
}

.mf-game .mf-card--story-groups-equals > .mf-equals-row {
  min-height: 0;
}

/* 105's accepted story, cue and equation card keeps its 2:2:1 allocation and
   one content size across all three sections. */
.mf-game .mf-card--story-cue-equation {
  --mf-content-size: clamp(16px, min(3vw, 6vh), 32px);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 2fr) minmax(0, 2fr) minmax(0, 1fr);
  gap: var(--mf-card-gap);
}

.mf-game .mf-card--story-cue-equation > :is(.mf-statement, .mf-counting-cue, .mf-equation-row) {
  width: 100%;
  min-width: 0;
  min-height: 0;
}

.mf-game .mf-card--story-cue-equation > .mf-statement,
.mf-game .mf-card--story-cue-equation > .mf-counting-cue,
.mf-game .mf-card--story-cue-equation > .mf-equation-row {
  font-size: var(--mf-content-size);
}

.mf-game .mf-card--story-cue-equation > .mf-counting-cue {
  height: 100%;
}

.mf-game .mf-card--story-cue-equation > .mf-equation-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  place-items: stretch;
}

/* ML 1.06's source-to-target board. The representation inside each panel is
   lesson-owned, while the panel, arrow, and target slot stay reusable. */
.mf-game .mf-card--source-target-match {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  align-items: stretch;
  gap: 0;
}

.mf-game .mf-match-board {
  display: grid;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  grid-template-columns: minmax(0, 1.25fr) minmax(34px, auto) minmax(0, .75fr);
  align-items: stretch;
  gap: clamp(8px, 1.6vw, 16px);
}

.mf-game .mf-match-panel {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  align-content: stretch;
  justify-items: center;
  gap: clamp(8px, 1.8vh, 16px);
  padding: 10px;
  color: var(--mf-ink);
  background: var(--mf-picture);
  border: 3px solid var(--mf-dotted-border);
  border-radius: 16px;
}

.mf-game .mf-match-panel--target { background: var(--mf-picture-alt); }

.mf-game .mf-match-heading {
  min-width: 0;
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--mf-ink);
  font-family: var(--mg-font-shout);
  font-size: clamp(19px, 2.5vw, 28px);
  letter-spacing: 1px;
  text-align: center;
}

.mf-game .mf-match-heading > b { overflow-wrap: anywhere; }
.mf-game .mf-match-heading .mp-robot-badge { flex: 0 0 auto; }

.mf-game .mf-match-content {
  width: 100%;
  min-width: 0;
  min-height: 0;
  display: grid;
  place-items: center;
  align-content: center;
}

/* A representation host sits in the panel's flexible content row. A
   percentage height has no definite containing block here, so it falls back
   to the diagram's intrinsic height and makes the panel grow past its row.
   Let the grid row provide the budget instead. */
.mf-game .mf-match-content > .mp-representation-host {
  height: auto;
  align-self: stretch;
}

.mf-game .mf-match-content > .mp-representation-host > .mp-representation {
  height: 100%;
  min-height: 0;
}

.mf-game .mf-match-content > .mp-representation-host > .mp-representation--diagram {
  grid-template-rows: auto minmax(0, 1fr) auto;
}

.mf-game .mf-match-content > .mp-representation-host > .mp-representation--diagram .mp-diagram-svg {
  width: auto;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.mf-game .mf-match-empty {
  display: grid;
  min-height: 84px;
  place-items: center;
  color: #355080;
  font-size: clamp(14px, 2vw, 18px);
  font-weight: 700;
  text-align: center;
}

.mf-game .mf-match-arrow {
  align-self: center;
  color: var(--mf-accent);
  font-family: var(--mg-font-shout);
  font-size: clamp(30px, 5vw, 50px);
  line-height: 1;
}

.mf-game .mf-match-target-slot {

/* Minilessons response layouts stay inside the shared frame. */

.mp-game .mp-match-set-targets { grid-template-rows: repeat(3, minmax(0, 1fr)); }

.mp-game .mp-match-set-target { align-self: center; min-height: 64px; background: var(--mf-picture-alt); }

.mp-game .mp-match-set-target--matched { border-color: #17785f; }

.mp-game .mp-match-set-source .mp-diagram-svg { width: 100%; height: 100%; max-height: 145px; }

.mp-game .mp-match-set-source .mp-story-text {   gap: 3px; }
.mp-game .mp-match-set-equation { display: grid; place-items: center; min-width: 0;  font-weight: 700; white-space: nowrap; }
.mp-game .mp-match-set-connections { position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
/* Three connector styles, one per source row. Routes and tips differ in
   silhouette, so no colour or label is needed to tell them apart: A swoops
   with a broad solid arrow, B runs straight into a hollow chevron, C glides
   in a shallow sweep to a long slim dart. The shaft draws over 460 ms via
   pathLength and the tip attaches when the draw completes. */
.mp-game .mp-match-set-connection {
  fill: none;
  stroke: #111;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0;
}
.mp-game .mp-match-set-connection--curve { stroke-width: 5.5; }
.mp-game .mp-match-set-connection--straight { stroke-width: 4.5; }
.mp-game .mp-match-set-connection--sweep { stroke-width: 4; }
/* Review-only robot set (?connectorSet=robot). Each part is a Robot Workshop
   component in the 105/106 palette: a navy outline layer under a coloured
   body, with mounts, joints and tips as markers. The main path is the body:
   teal arm tube, cream steel piston rod, blue cable core. Layers share the
   460 ms draw so the whole part grows out of its mount together. */
.mp-game .mp-match-set-connection--arm { stroke: #37c8c5; stroke-width: 7; stroke-linejoin: round; }
.mp-game .mp-match-set-connection--piston { stroke: #fff4d6; stroke-width: 3.5; }
.mp-game .mp-match-set-connection--cable { stroke: #3156d8; stroke-width: 5.5; stroke-linejoin: round; }
/* Robot end effectors grab a handle on the answer card's outer edge, so the
   robot board paints above the cards. The layer is pointer-events: none, so
   taps still land on the cards underneath. */
.mp-game .mp-match-set-connections[data-connector-set="robot"] { z-index: 2; }
/* The handle: a cream half-moon with a teal bolt whose flat side just
   touches the card. The SVG draws the flat side's outer stroke on the box's
   right edge, and `left` is the 12 px box plus the card's 2 px border, so
   that edge lands exactly on the card's outer border: touching, not
   overlapping, with the whole half-moon outside the rectangle. In short
   landscape the box is rotated onto the top edge the same way. Decorative
   only: it takes no pointer events and adds nothing to the card's hit box. */
.mp-game .mp-match-set-handle {
  position: absolute;
  left: -14px;
  top: 50%;
  width: 12px;
  height: 20px;
  transform: translateY(-50%);
  pointer-events: none;
  z-index: 0;
}
.mp-game .mp-match-set-handle > svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
@media (min-width: 561px) and (max-height: 500px) {
  .mp-game .mp-match-set-handle {
    left: calc(50% - 6px);
    top: -18px;
    transform: rotate(90deg);
  }
}
.mp-game .mp-match-set-connection-layer,
.mp-game .mp-match-set-connection-sleeve {
  fill: none;
  stroke: #13213f;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0;
}
.mp-game .mp-match-set-connection-layer--arm-outline { stroke-width: 12; }
.mp-game .mp-match-set-connection-layer--piston-outline { stroke-width: 7.5; }
.mp-game .mp-match-set-connection-layer--cable-outline { stroke-width: 10; }
/* Accent layers carry a dash pattern that is the design itself (rivets on
   the arm, ridges on the cable, band rings on the barrel), so they fade in
   as the draw completes instead of drawing. */
.mp-game .mp-match-set-connection-layer--arm-rivet-accent,
.mp-game .mp-match-set-connection-layer--arm-rivet-accent-2 {
  stroke: #fff4d6;
  stroke-width: 2.4;
  stroke-dasharray: .012 .11;
  stroke-dashoffset: -.05;
}
/* Arm joint paths carry a gear as marker-end and nothing else: no stroke,
   no draw, so only the gear's own reveal is ever seen. */
.mp-game .mp-match-set-connection-joint {
  fill: none;
  stroke: transparent;
  stroke-width: 1;
}
.mp-game .mp-match-set-connection-layer--cable-ridge-accent {
  stroke: #fff4d6;
  stroke-width: 2;
  stroke-linecap: butt;
  stroke-dasharray: .03 .05;
  stroke-dashoffset: 0;
}
.mp-game .mp-match-set-connection-sleeve--barrel-band-accent {
  stroke: #13213f;
  stroke-width: 12.5;
  stroke-linecap: butt;
  stroke-dasharray: .07 .26;
  stroke-dashoffset: -.2;
}
.mp-game .mp-match-set-connection-layer--matched {
  opacity: 1;
  animation: mp-match-set-line-draw 460ms cubic-bezier(.22, .72, .3, 1) both;
}
.mp-game :is(.mp-match-set-connection-layer, .mp-match-set-connection-sleeve)[class*="-accent"] {
  opacity: 0;
}
.mp-game .mp-match-set-connection-layer--matched[class*="-accent"],
.mp-game .mp-match-set-connection-sleeve--matched[class*="-accent"] {
  animation: mp-match-set-layer-fade 460ms ease-out both;
}
@keyframes mp-match-set-layer-fade {
  0%, 62% { opacity: 0; }
  100% { opacity: 1; }
}
/* Three-stage hydraulic ram: the orange barrel draws first, the teal middle
   stage next, and the cream rod last, so the ram visibly telescopes. */
.mp-game .mp-match-set-connection-sleeve--stage-outline { stroke-width: 12; }
.mp-game .mp-match-set-connection-sleeve--stage-fill { stroke: #37c8c5; stroke-width: 8; }
.mp-game .mp-match-set-connection-sleeve--barrel-outline { stroke-width: 17; }
.mp-game .mp-match-set-connection-sleeve--barrel-fill { stroke: #f29b38; stroke-width: 12.5; }
.mp-game .mp-match-set-connection-sleeve--barrel-shine { stroke: #fff4d6; stroke-width: 2.5; }
.mp-game .mp-match-set-connection-sleeve--matched {
  opacity: 1;
  animation: mp-match-set-line-draw 330ms cubic-bezier(.22, .72, .3, 1) both;
}
.mp-game .mp-match-set-connection-sleeve--matched[class*="barrel-"]:not([class*="-accent"]) {
  animation-duration: 200ms;
}
/* Marker reveals. Shapes are drawn in their final gripping pose; when the
   marker goes live the part starts open or retracted and settles closed.
   Origins are fill-box fractions so each finger and jaw turns on its hinge. */
.mp-game .mp-mount,
.mp-game .mp-gear,
.mp-game .mp-gripper-finger,
.mp-game .mp-piston-head,
.mp-game .mp-piston-latch,
.mp-game .mp-claw-jaw {
  transform-box: fill-box;
  transform-origin: 50% 50%;
}
.mp-game .mp-marker--live .mp-mount { animation: mp-robot-mount-pop 260ms cubic-bezier(.2, .85, .3, 1.3) both; }
/* Every gear makes one finite turn, --mp-gear-delay after its marker goes
   live, then stops. index.js sets the delay, duration and keyframes on each
   marker: the arm's two gears pop in and quarter-turn at 320 and 1260 ms as
   their sections land; the piston's drive gear and the cable reel are
   visible from the mount's pop, sit still while their bodies extend, then
   half-turn and full-turn respectively from 460 to 980 ms, while a smaller
   terminal gear expands on each body's end and turns with them. */
.mp-game .mp-marker--live .mp-gear { animation: var(--mp-gear-anim, mp-robot-gear-arrive) var(--mp-gear-ms, 620ms) cubic-bezier(.2, .8, .3, 1) var(--mp-gear-delay, 0ms) both; }
/* A terminal gear's housing (the sleeve the hand slides out of) sits under
   the gear on its outgoing side. It is hidden until the gear's delay, then
   extends out of the gear's centre over the gear's own 100 ms pop, and never
   turns. */
.mp-game .mp-gear-housing { transform-box: fill-box; transform-origin: 0% 50%; }
.mp-game .mp-marker--live .mp-gear-housing { animation: mp-robot-housing-extend 160ms cubic-bezier(.2, .8, .3, 1) var(--mp-gear-delay, 0ms) both; }
@keyframes mp-robot-housing-extend {
  0% { opacity: 0; transform: scaleX(.2); }
  30% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
/* Terminal sequence. The shaft draws to the staging point (460 ms; the arm
   reaches it at 1260 ms after its staged sections). The tip attaches there
   with its effector held back by the approach length and turned to the
   angle it arrived at, and its hand body retracted --mp-retract behind the
   wrist, inside the terminal gear's housing: a sleeve clip on the housing
   mouth (index.js) hides everything behind the mouth and the gear, painted
   above the tip, hides what is inside it. --mp-hand-delay later (the
   terminal gear's turn) the body slides out of the mouth over 440 ms, so
   its leading edge shows first and the wrist block clears the mouth last;
   the wrist then swings to face the card (440 to 650 ms) and the effector
   slides straight into the handle (650 to 860 ms) while the shaft draws the
   last stretch; then it closes on the hook. Every step is finite and the
   hand is never faded or scaled into view. The effector's origin is the
   wrist: each tip carries an invisible footprint rect symmetric about the
   wrist, so the fill-box centre stays put while the body is retracted. */
.mp-game .mp-effector { transform-box: fill-box; transform-origin: 50% 50%; }
.mp-game .mp-marker--live .mp-effector { animation: var(--mp-hand-anim, mp-robot-wrist-approach) var(--mp-hand-ms, 420ms) cubic-bezier(.25, .8, .3, 1) var(--mp-hand-delay, 0ms) both; }
.mp-game .mp-hand-body { transform: translateX(var(--mp-retract, 0px)); }
.mp-game .mp-marker--live .mp-hand-body { animation: mp-robot-hand-emerge 440ms cubic-bezier(.3, .6, .25, 1) var(--mp-hand-delay, 0ms) both; }
@keyframes mp-robot-hand-emerge {
  from { transform: translateX(var(--mp-retract, 0px)); }
  to { transform: none; }
}
@keyframes mp-robot-hand-emerge-approach {
  0%, 51.16% { transform: translateX(var(--mp-approach, 0px)) rotate(var(--mp-wrist, 0deg)); }
  75.58% { transform: translateX(var(--mp-approach, 0px)) rotate(0deg); }
  100% { transform: none; }
}
.mp-game .mp-match-set-connections[data-connector-set="robot"] :is(.mp-match-set-connection--matched, .mp-match-set-connection-layer--matched:not([class*="-accent"])) {
  animation:
    mp-match-set-line-draw 460ms cubic-bezier(.22, .72, .3, 1) both,
    mp-robot-approach-draw 210ms cubic-bezier(.3, .9, .4, 1) 1110ms forwards;
}
/* Articulated arm: three causal stages instead of one draw. Section 1 grows
   from the shoulder to the first gear (0 to 320 ms); that gear pops in and
   turns (320 to 940); section 2 grows from it to the second gear (940 to
   1260); that gear and its housing pop in and the gear turns (1260 to
   1880); then the hand slides out of the housing (1880 to 2320), swings to
   face the card (2320 to 2530) and the approach draws (2530 to 2740) as it
   slides in. Section 2 fills forwards only, so it cannot show the second
   stretch before its own start. The outline layer shares the schedule so
   the tube grows as one part. */
.mp-game .mp-match-set-connections[data-connector-set="robot"] :is(.mp-match-set-connection--arm.mp-match-set-connection--matched, .mp-match-set-connection-layer--arm-outline.mp-match-set-connection-layer--matched) {
  animation:
    mp-robot-arm-section-1 320ms cubic-bezier(.22, .72, .3, 1) both,
    mp-robot-arm-section-2 320ms cubic-bezier(.22, .72, .3, 1) 940ms forwards,
    mp-robot-approach-draw 210ms cubic-bezier(.3, .9, .4, 1) 2530ms forwards;
}
@keyframes mp-robot-arm-section-1 {
  0% { opacity: 0; stroke-dashoffset: 1; }
  20% { opacity: 1; }
  100% { opacity: 1; stroke-dashoffset: var(--mp-elbow-offset, 0); }
}
@keyframes mp-robot-arm-section-2 {
  from { stroke-dashoffset: var(--mp-elbow-offset, 0); }
  to { stroke-dashoffset: var(--mp-stage-offset, 0); }
}
/* Piston and cable: two causal stages. The body extends first (0 to 460 ms,
   the ram telescoping or the cable paying out) with the drive gear still on
   its mount. Then a terminal gear expands on the body's end and turns with
   the drive gear (460 to 980 ms). The tip attaches at the draw's end but
   its marker carries a 520 ms --mp-hand-delay, so the head or claw only
   slides out of the terminal gear's housing after that turn (980 to 1420),
   swings (1420 to 1630) and approaches; the approach therefore draws at
   1630 ms, 520 ms later than the generic 1110. */
.mp-game .mp-match-set-connections[data-connector-set="robot"] :is(.mp-match-set-connection--piston.mp-match-set-connection--matched, .mp-match-set-connection--cable.mp-match-set-connection--matched, .mp-match-set-connection-layer--piston-outline.mp-match-set-connection-layer--matched, .mp-match-set-connection-layer--cable-outline.mp-match-set-connection-layer--matched) {
  animation:
    mp-match-set-line-draw 460ms cubic-bezier(.22, .72, .3, 1) both,
    mp-robot-approach-draw 210ms cubic-bezier(.3, .9, .4, 1) 1630ms forwards;
}
/* The rivets are one piece per section, each fading in as its section lands. */
.mp-game .mp-match-set-connection-layer--arm-rivet-accent.mp-match-set-connection-layer--matched {
  animation: mp-match-set-layer-fade 320ms ease-out both;
}
.mp-game .mp-match-set-connection-layer--arm-rivet-accent-2.mp-match-set-connection-layer--matched {
  animation: mp-match-set-layer-fade 320ms ease-out 940ms both;
}
@keyframes mp-robot-approach-draw {
  from { stroke-dashoffset: var(--mp-stage-offset, 0); }
  to { stroke-dashoffset: 0; }
}
@keyframes mp-robot-wrist-approach {
  0% { transform: translateX(var(--mp-approach, 0px)) rotate(var(--mp-wrist, 0deg)); }
  50% { transform: translateX(var(--mp-approach, 0px)) rotate(0deg); }
  100% { transform: none; }
}
.mp-game .mp-gripper-finger--upper { transform-origin: 0% 0%; }
.mp-game .mp-gripper-finger--lower { transform-origin: 0% 100%; }
/* Fingers close once the hand has arrived: the 620 ms hold plus the 860 ms
   emerge, swing and approach. */
.mp-game .mp-marker--live .mp-gripper-finger--upper { animation: mp-robot-finger-close-upper 360ms cubic-bezier(.3, 1.35, .5, 1) 1480ms both; }
.mp-game .mp-marker--live .mp-gripper-finger--lower { animation: mp-robot-finger-close-lower 360ms cubic-bezier(.3, 1.35, .5, 1) 1480ms both; }
/* Head, latch and jaws close once their tip has arrived: the 520 ms hold
   while the drive gear or reel turns, plus the 860 ms emerge, swing and
   approach; the latch follows the head's thunk by 60 ms. */
.mp-game .mp-piston-head { transform-origin: 0% 50%; }
.mp-game .mp-marker--live .mp-piston-head { animation: mp-robot-head-thunk 300ms cubic-bezier(.2, .9, .3, 1.2) 1380ms both; }
.mp-game .mp-marker--live .mp-piston-latch { animation: mp-robot-latch-slide 320ms cubic-bezier(.3, 1.3, .5, 1) 1440ms both; }
.mp-game .mp-claw-jaw--upper { transform-origin: 8% 92%; }
.mp-game .mp-claw-jaw--lower { transform-origin: 8% 8%; }
.mp-game .mp-marker--live .mp-claw-jaw--upper { animation: mp-robot-claw-close-upper 380ms cubic-bezier(.3, 1.4, .5, 1) 1380ms both; }
.mp-game .mp-marker--live .mp-claw-jaw--lower { animation: mp-robot-claw-close-lower 380ms cubic-bezier(.3, 1.4, .5, 1) 1380ms both; }
@keyframes mp-robot-mount-pop { from { transform: scale(.3); } to { transform: none; } }
/* Pop in over the first 100 ms, then a quarter turn (two teeth of the
   eight-tooth gear) over 520 ms, so the settled pose matches the drawn one
   exactly and the gear ends centred on its pivot. */
@keyframes mp-robot-gear-arrive {
  0% { opacity: 0; transform: scale(.4) rotate(-90deg); }
  16% { opacity: 1; transform: scale(1) rotate(-90deg); }
  100% { opacity: 1; transform: none; }
}
/* Piston drive gear: already visible with its housing, still until its
   delay, then a half turn the other way (three of its six teeth), the
   settled pose again matching the drawn one. */
@keyframes mp-robot-gear-drive {
  from { transform: rotate(0deg); }
  to { transform: rotate(-180deg); }
}
/* Piston terminal gear: expands on the rod's end, then the same half turn
   in the same direction as the drive gear, like a gear train. */
@keyframes mp-robot-gear-arrive-drive {
  0% { opacity: 0; transform: scale(.4) rotate(180deg); }
  16% { opacity: 1; transform: scale(1) rotate(180deg); }
  100% { opacity: 1; transform: none; }
}
/* Cable reel: still while the cable pays out, then one full turn. */
@keyframes mp-robot-reel-unspool {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes mp-robot-finger-close-upper { from { transform: rotate(-24deg); } to { transform: none; } }
@keyframes mp-robot-finger-close-lower { from { transform: rotate(24deg); } to { transform: none; } }

@keyframes mp-robot-latch-slide { from { transform: translateX(-9px); } to { transform: none; } }
@keyframes mp-robot-claw-close-upper { from { transform: rotate(-28deg); } to { transform: none; } }
