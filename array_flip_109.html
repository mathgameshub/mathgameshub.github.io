.game-frame {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
.gf-hidden { display: none !important; }

/* Start and end overlays. */
.gf-screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: linear-gradient(155deg, var(--gf-bg-a) 0%, #243d9f 48%, var(--gf-bg-b) 100%);
}
.gf-card {
  width: min(920px, 100%);
  max-height: calc(100% - 32px);
  overflow: auto;
  padding: 24px 22px;
  color: var(--gf-ink);
  background: var(--gf-card);
  border: var(--gf-outline) solid var(--gf-ink);
  border-radius: 24px;
  box-shadow: var(--gf-shadow);
  text-align: center;
}
.gf-start-card, .gf-end-card { width: min(560px, 100%); }
.gf-end-card { display: flex; flex-direction: column; overflow: hidden; }
.gf-end-extra { min-height: 0; overflow-y: auto; }
.gf-end-card .game-end-actions { flex: 0 0 auto; }
.gf-emoji { font-size: 56px; line-height: 1; }
.gf-title {
  margin-top: 6px;
  color: var(--gf-ink);
  font-family: var(--gf-font-shout);
  font-size: clamp(34px, 8vw, 52px);
  letter-spacing: 2px;
  text-shadow: 3px 3px 0 var(--gf-accent);
}
.gf-subtitle { margin-top: 4px; font-size: 20px; font-weight: 600; }
.gf-tag {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 10px;
  color: var(--gf-bg-b);
  background: #f5f3ff;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
}
.gf-example {
  display: grid;
  gap: 8px;
  margin: 16px 0;
  padding: 14px;
  color: var(--gf-ink);
  background: var(--gf-picture);
  border: 3px dashed var(--gf-dotted-border);
  border-radius: 16px;
  font-size: 18px;
}
.gf-example-label, .gf-sample-kicker { color: #355080; font-size: 13px; font-weight: 800; letter-spacing: 1px; }
.gf-example-body { font-weight: 600; }
.gf-big-btn {
  min-height: 64px;
  padding: 14px 40px;
  color: var(--gf-ink);
  background: var(--gf-accent);
  border: var(--gf-outline) solid var(--gf-ink);
  border-radius: 999px;
  box-shadow: 0 6px 0 var(--gf-ink);
  cursor: pointer;
  font-family: var(--gf-font-shout);
  font-size: 30px;
  letter-spacing: 2px;
  transition: transform .08s, box-shadow .08s;
}
.gf-big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gf-ink); }
.gf-big-btn:focus-visible, .gf-retry:focus-visible, .gf-tile:focus-visible, .gf-sound:focus-visible {
  outline: 4px solid #ffd93d;
  outline-offset: 4px;
}

/* Shared header and progress. */
.gf-shell { display: flex; flex: 1; min-height: 0; flex-direction: column; }
.gf-hud, .gf-progress, .gf-stage { width: min(920px, calc(100% - 32px)); margin-inline: auto; }
.gf-hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 0;
  font-family: var(--gf-font-shout);
  letter-spacing: 1px;
  text-shadow: 2px 2px 0 rgb(0 0 0 / 35%);
}
.gf-hud-title {
  min-width: 0;
  overflow: hidden;
  padding-inline: .15em;
  font-size: clamp(15px, 4vw, 40px);
  line-height: 1.2;
  text-overflow: clip;
  white-space: nowrap;
}
.gf-chips { display: flex; flex-shrink: 0; gap: 8px; }
.gf-chip {
  display: flex;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  padding: 4px 12px;
  color: var(--gf-ink);
  background: var(--gf-card);
  border: 3px solid var(--gf-ink);
  border-radius: 999px;
  box-shadow: 0 3px 0 var(--gf-ink);
  font-size: 18px;
  line-height: 1;
  text-shadow: none;
}
.gf-chip--hot { background: var(--gf-accent); }
.gf-progress {
  height: 10px;
  overflow: hidden;
  background: rgb(0 0 0 / 25%);
  border-radius: 999px;
}
.gf-progress > i { display: block; width: 0; height: 100%; background: var(--gf-good); transition: width .3s; }

/* Prompt, lesson card slot and answer grid. */
.gf-stage {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  gap: 20px;
  padding: 10px 0 calc(60px + 6px + env(safe-area-inset-bottom, 0px));
}
.gf-prompt {
  flex: 0 0 auto;
  padding: 14px;
  color: var(--gf-ink);
  background: var(--gf-card);
  border: var(--gf-outline) solid var(--gf-ink);
  border-radius: 20px;
  box-shadow: var(--gf-shadow);
  font-size: 28px;
  font-weight: 600;
  text-align: center;
}
.gf-visual { display: flex; flex: 1 1 auto; min-height: 0; align-items: center; justify-content: center; }
.gf-problem-card {
  position: relative;
  display: grid;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  place-items: center;
  padding: clamp(10px, 1.5vw, 16px);
  color: var(--gf-ink);
  background: var(--gf-card);
  border: var(--gf-outline) solid var(--gf-ink);
  border-radius: var(--gf-card-radius);
  box-shadow: 0 6px 0 var(--gf-ink);
  text-align: center;
}
.gf-problem-slot {
  display: grid;
  width: min(720px, 100%);
  min-height: 100px;
  place-items: center;
  padding: clamp(16px, 3vw, 30px);
  background: var(--gf-picture);
  border: 3px dashed var(--gf-dotted-border);
  border-radius: 16px;
}
.gf-sample-kicker { margin-bottom: 8px; }
.gf-sample-title { font-size: clamp(24px, 5vw, 42px); }
.gf-sample-detail { margin-top: 8px; font-size: clamp(16px, 3vw, 24px); font-weight: 600; }
.gf-sound {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 2;
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  padding: 0;
  color: var(--gf-ink);
  background: var(--gf-card);
  border: 3px solid var(--gf-ink);
  border-radius: 50%;
  box-shadow: 0 3px 0 var(--gf-ink);
  cursor: pointer;
  font-size: 20px;
}
.gf-sound:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gf-ink); }
.gf-tiles { display: grid; width: min(686px, 85%); align-self: center; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10.8px; }
.gf-tile {
  display: grid;
  min-height: 104.85px;
  place-items: center;
  padding: 10px;
  color: var(--gf-ink);
  background: var(--gf-card);
  border: var(--gf-outline) solid var(--gf-ink);
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--gf-ink);
  cursor: pointer;
  font-family: var(--gf-font-read);
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 700;
  transition: transform .08s, box-shadow .08s, background .15s;
}
.gf-tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gf-ink); }
.gf-tile:disabled { cursor: default; }
.gf-tile.gf-right { background: var(--gf-good); }
.gf-tile.gf-wrong { background: var(--gf-warm); }

/* Toasts, modal feedback and end statistics. */
.gf-fx { position: absolute; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
.gf-toast {
  position: absolute;
  top: 38%;
  left: 50%;
  color: #fff;
  font-family: var(--gf-font-shout);
  font-size: clamp(45px, 9vw, 84px);
  letter-spacing: 3px;
  text-shadow: 4px 4px 0 var(--gf-ink);
  transform: translate(-50%, -50%);
  animation: gf-toast .9s ease-out forwards;
}
.gf-toast--warm { color: var(--gf-warm); font-size: clamp(28px, 7vw, 44px); }
.gf-popup {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 4;
  display: grid;
  width: min(600px, calc(100% - 32px));
  max-width: calc(100% - 32px);
  max-height: calc(100% - 32px);
  align-content: center;
  justify-items: center;
  gap: clamp(8px, 1.8vh, 16px);
  overflow-y: auto;
  padding: clamp(16px, 2.5vh, 24px) clamp(18px, 2.5vw, 30px);
  color: var(--gf-ink);
  background: var(--gf-card);
  border: var(--gf-outline) solid var(--gf-ink);
  border-radius: 20px;
  box-shadow: 0 8px 0 var(--gf-ink);
  pointer-events: auto;
  text-align: center;
  transform: translate(-50%, -50%);
  animation: gf-popup-in .24s ease-out;
}
.gf-popup-title { max-width: 30ch; font-size: 28px; font-weight: 800; line-height: 1.15; }
.gf-popup-content { width: 100%; font-size: 24px; font-weight: 700; line-height: 1.2; }
.gf-popup-content:empty { display: none; }
.gf-popup--cue .gf-popup-title { width: 100%; padding: 12px 18px; background: var(--gf-picture); border: 3px solid var(--gf-dotted-border); border-radius: 15px; }
.gf-retry {
  min-height: 44px;
  margin-top: 2px;
  padding: 7px 20px;
  color: var(--gf-ink);
  background: #ffd93d;
  border: 3px solid var(--gf-ink);
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--gf-ink);
  cursor: pointer;
  font-family: var(--gf-font-shout);
  font-size: clamp(18px, 2.2vw, 27px);
  letter-spacing: 1px;
}
.gf-retry:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gf-ink); }
.gf-stats { display: flex; justify-content: center; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
.gf-stat { min-width: 110px; padding: 10px 18px; background: #f5f3ff; border: 3px solid var(--gf-ink); border-radius: 16px; }
.gf-stat b { display: block; font-family: var(--gf-font-shout); font-size: 32px; letter-spacing: 1px; }
@keyframes gf-popup-in { from { opacity: 0; transform: translate(-50%, -42%) scale(.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes gf-toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }

@media (max-width: 560px) {
  .gf-hud, .gf-progress, .gf-stage { width: min(920px, calc(100% - 20px)); }
  .gf-hud { padding-block: 8px; }
  .gf-chip { padding-inline: 9px; font-size: 16px; }
  .gf-stage { gap: 14px; }
  .gf-prompt { padding: 10px; font-size: 20px; }
  .gf-tile { min-height: 66.6px; font-size: 24px; }
  .gf-problem-card { padding: 8px; border-radius: 18px; }
  .gf-popup { width: min(600px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 12px; }
  .gf-popup-title { font-size: 24px; }
  .gf-popup-content { font-size: 20px; }
}
@media (max-width: 360px) and (max-height: 600px) {
  .gf-tile { min-height: 57.15px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .gf-stage { gap: 14px; padding-top: 4px; }
  .gf-prompt { font-size: 20px; }
  .gf-tiles { width: min(686px, 85%); grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .gf-tile { min-height: 54px; padding: 4px 10px; line-height: 1; }
  .gf-problem-card { padding: 4px; border-radius: 16px; }
  .gf-popup { width: min(600px, calc(100% - 16px)); max-height: calc(100% - 16px); padding: 10px; }
  .gf-popup-content { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .game-frame *, .game-frame { animation: none !important; transition: none !important; }
}

/* ============================================================
   Game 109 (ML 1.09): Sticker Album arrays, two expressions each. Everything below is
   lesson-owned; the shell above is the Game 107 starter copy.
   Palette tokens (--af-*) are set from theme.js at mount.
   ============================================================ */
body { background: linear-gradient(155deg, var(--gf-bg-a) 0%, #4D5FD0 52%, var(--gf-bg-b) 100%); }
.gf-screen { background: linear-gradient(155deg, var(--gf-bg-a) 0%, #4D5FD0 52%, var(--gf-bg-b) 100%); }

/* The Question Prompt is the frame's prompt bar above the Problem Card
   (captain, 109: select-all cards hold only the Array Display). The card's
   dashed slot becomes the full card interior so the lesson lays it out. */
.game-frame--af .gf-stage { gap: 16px; }
.game-frame--af .gf-prompt { font-size: clamp(20px, 2.4vw, 26px); padding: 12px 14px; line-height: 1.2; }
.game-frame--af .gf-problem-card { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); padding: clamp(12px, 2vw, 22px); }
.game-frame--af .gf-problem-slot {
  width: 100%;
  height: 100%;
  min-height: 0;
  padding: 0;
  background: none;
  border: 0;
  border-radius: 0;
  place-items: stretch;
}

/* Problem Card contents. Select-all: the Array Display alone. Completion:
   Array Display left, Expression Rows right. Product: a closed album page
   that opens on the answer. */
.af-card {
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  align-items: center;
  justify-items: center;
  width: 100%;
  height: 100%;
  min-height: 0;
  row-gap: clamp(10px, 2.4vh, 22px);
  padding: clamp(4px, 1vh, 10px) clamp(8px, 2vw, 24px);
}
.af-card--complete {
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  column-gap: clamp(14px, 3vw, 40px);
  padding-right: clamp(40px, 5vw, 56px);
}
.af-card--complete .af-array--card { grid-column: 1; }
.af-card--complete .af-rows { grid-column: 2; }

/* Expression Rows: two writing lines, "expression 1:" and "expression 2:".
   A blank is a writing line; the active one glows; a filled one pops in. */
.af-rows { display: grid; gap: clamp(12px, 2.4vh, 24px); justify-items: start; width: 100%; max-width: 360px; }
.af-row { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: clamp(8px, 1.2vw, 14px); width: 100%; }
.af-row-label { font-size: clamp(17px, 1.9vw, 22px); font-weight: 700; color: var(--af-bg-a, #6B3FA0); white-space: nowrap; }
.af-row-line { display: flex; align-items: center; gap: clamp(6px, 1vw, 10px); min-height: 52px; }
.af-slot { display: inline-grid; place-items: center; min-height: 48px; font-size: clamp(24px, 3vw, 34px); font-weight: 700; line-height: 1; }
.af-slot--fixed { min-width: 1.4em; }
.af-slot--times { font-size: clamp(22px, 2.6vw, 30px); }
.af-slot--blank {
  min-width: 2.1em;
  padding: 4px 10px;
  background: #fff;
  border: 3px dashed var(--gf-dotted-border);
  border-radius: 12px;
  color: transparent;
  transition: border-color .2s, box-shadow .2s, transform .2s;
}
.af-slot--wide { min-width: 5.2em; }
.af-slot--active {
  border-color: var(--gf-accent);
  box-shadow: 0 0 0 4px rgb(242 155 56 / 35%);
  animation: af-slot-pulse 1.1s ease-in-out infinite alternate;
}
@keyframes af-slot-pulse { from { box-shadow: 0 0 0 3px rgb(242 155 56 / 30%); } to { box-shadow: 0 0 0 7px rgb(255 212 90 / 55%); transform: translateY(-2px); } }
.af-slot--filled { color: var(--gf-ink); }
@keyframes af-slot-in { from { transform: translateY(-16px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* The commutative statement that appears after the flip: under the
   Expression Rows on a completion card, on its own row under the array on a
   select-all or product card. */
.af-equals {
  justify-self: center;
  padding: 6px 18px;
  background: #fff;
  border: 3px solid var(--gf-good);
  border-radius: 999px;
  font-size: clamp(20px, 2.6vw, 30px);
  font-weight: 700;
  color: var(--gf-ink);
  animation: af-slot-in .36s cubic-bezier(.2,.9,.3,1.3) both;
}
.af-rows .af-equals { justify-self: start; margin-top: 4px; }
/* On a select-all or product card the statement takes its own row under the
   array, so no sticker is covered. */
.af-card--select, .af-card--product { grid-template-rows: minmax(0, 1fr) auto; }
.af-card--select .af-equals, .af-card--product .af-equals { grid-row: 2; }
.af-equals--float {
  position: absolute;
  z-index: 2;
  transform: translate(-50%, -50%);
  box-shadow: 0 4px 0 var(--gf-ink);
  animation-name: af-equals-float;
}
@keyframes af-equals-float { from { transform: translate(-50%, -30%) scale(.7); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

/* Product form: a closed album page with a mystery sticker until solved. */
.af-card--product .af-array--card { max-height: 100%; }
.af-cover {
  display: grid;
  place-items: center;
  width: min(100%, 420px);
  height: 100%;
  max-height: 260px;
  padding: 12px;
  background:
    repeating-linear-gradient(0deg, transparent 0 15px, var(--af-page-line, #DCE3F7) 15px 16px),
    var(--af-page, #fff);
  border: 3px solid var(--gf-ink);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--gf-ink);
}
.af-cover-sticker {
  display: grid;
  place-items: center;
  width: clamp(72px, 12vw, 110px);
  height: clamp(72px, 12vw, 110px);
  background: var(--af-sticker, #FFD45A);
  border: 3px solid var(--gf-ink);
  border-radius: 18px;
  font-family: var(--gf-font-shout);
  font-size: clamp(44px, 7vw, 66px);
  color: var(--gf-ink);
  animation: af-wobble 2.2s ease-in-out infinite;
}
@keyframes af-wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
.af-cover-copy { margin-top: 10px; font-size: clamp(15px, 1.8vw, 18px); font-weight: 700; color: var(--af-bg-a, #6B3FA0); }

/* The quarter-turn flip: keyframes live in the motion block below. */
.af-page { transform-origin: 50% 50%; }
.af-prompt {
  max-width: 40ch;
  font-size: clamp(19px, 2.2vw, 26px);
  font-weight: 600;
  line-height: 1.2;
}
.af-caption {
  padding: 4px 16px;
  font-size: clamp(17px, 2.2vw, 22px);
  font-weight: 700;
  color: var(--gf-ink);
  background: var(--af-picture, #F3F6FF);
  border: 3px solid var(--gf-dotted-border);
  border-radius: 999px;
}

/* Array Display: a white album page with a grid of stickers. Sticker size
   follows the container so rows and columns stay countable. */
.af-array {
  --af-gap: clamp(3px, 0.8vw, 8px);
  --af-cell: 40px;
  display: grid;
  min-width: 0;
  min-height: 0;
  place-items: center;
}
.af-array--card {
  width: 100%;
  height: 100%;
  container-type: size;
}
.af-page {
  position: relative;
  display: grid;
  place-items: center;
  padding: clamp(6px, 1vw, 10px);
  background:
    repeating-linear-gradient(0deg, transparent 0 15px, var(--af-page-line, #DCE3F7) 15px 16px),
    var(--af-page, #fff);
  border: 3px solid var(--gf-ink);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--gf-ink);
}
.af-grid {
  display: grid;
  grid-template-columns: repeat(var(--af-cols), var(--af-cell));
  grid-auto-rows: var(--af-cell);
  gap: var(--af-gap);
}
/* Fit: the page's inner area is the container; each cell takes the largest
   size that lets every column and every row fit with the gap. */
.af-array--card .af-grid {
  --af-cell: min(
    calc((100cqw - 26px - (var(--af-cols) - 1) * var(--af-gap)) / var(--af-cols)),
    calc((100cqh - 26px - (var(--af-rows) - 1) * var(--af-gap)) / var(--af-rows)),
    72px
  );
}
.af-cell {
  position: relative;
  display: grid;
  width: var(--af-cell);
  height: var(--af-cell);
  place-items: center;
}
.af-cell > svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 0 rgb(19 33 63 / 20%)); }
.af-array--peel .af-cell {
  animation: af-peel .38s cubic-bezier(.2,.9,.3,1.2) both;
  animation-delay: calc(120ms + var(--af-r) * 170ms + var(--af-c) * 22ms);
}
@keyframes af-peel {
  0% { opacity: 0; transform: translateY(-14px) rotate(-12deg) scale(.6); }
  60% { opacity: 1; transform: translateY(2px) rotate(3deg) scale(1.08); }
  100% { opacity: 1; transform: none; }
}
.af-cell--shine { animation: af-shine .5s ease-out both; animation-delay: var(--af-shine-delay, 0ms); }
@keyframes af-shine {
  0% { transform: scale(1); filter: brightness(1); }
  40% { transform: scale(1.22) rotate(-6deg); filter: brightness(1.35) drop-shadow(0 0 6px #ffd45a); }
  100% { transform: scale(1); filter: brightness(1); }
}
.af-array--solved .af-page { border-color: var(--gf-good); box-shadow: 0 4px 0 var(--gf-good); }

/* Braced help/example pictures: "R rows" beside, "C in each row" below. */
.af-array--braced {
  grid-template-columns: auto auto;
  grid-template-rows: auto auto;
  gap: 6px 10px;
  align-items: center;
  justify-items: center;
}
.af-array--braced .af-page { grid-column: 2; grid-row: 1; }
.af-brace {
  font-size: clamp(14px, 1.8vw, 18px);
  font-weight: 700;
  color: var(--af-bg-a, #6B3FA0);
}
.af-brace--rows { grid-column: 1; grid-row: 1; max-width: 5ch; text-align: center; writing-mode: horizontal-tb; }
.af-brace--cols { grid-column: 2; grid-row: 2; }
.af-array--help { --af-cell: clamp(22px, 5vw, 34px); --af-gap: 4px; }
.af-array--example {
  --af-cell: clamp(26px, 6vw, 40px);
  --af-gap: 5px;
  /* Reserve the three-sticker extent in both orientations before the turn. */
  --af-example-extent: calc(3 * var(--af-cell) + 2 * var(--af-gap) + 2 * clamp(6px, 1vw, 10px) + 6px);
  grid-template-columns: auto var(--af-example-extent);
  grid-template-rows: var(--af-example-extent) auto;
}
.af-cell--lit > svg { filter: drop-shadow(0 0 5px #ffd45a) brightness(1.15); }
.af-cell--current { animation: af-bump .3s ease-out; }
@keyframes af-bump { 50% { transform: scale(1.2); } }

/* Answer Grid: select-all. A found expression locks in as a right tile.
   Lesson-specific frame exception (recorded in REQUIREMENTS.md): select-all
   tiles are shorter than the starter's 104.85px so the Array Display keeps
   countable stickers for five-row arrays. */
.gf-tiles--multi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gf-tiles--multi .gf-tile { min-height: 84px; }
.gf-tile[data-found="true"] { background: var(--gf-good); }
.gf-tile[data-found="true"] .gf-answer-content::before {
  content: '\2713';
  margin-right: 8px;
}
  display: inline-grid;
  width: 36px;
  height: 36px;
  margin-right: 10px;
  place-items: center;
  background: var(--af-sticker, #FFD45A);
  border: 2px solid var(--gf-ink);
  border-radius: 50%;
  font-size: 20px;
  vertical-align: middle;
}
.gf-answer-content { display: inline-flex; align-items: center; justify-content: center; }

/* A tile of the wrong kind for the active writing line stays visible but
   muted (a number while an expression line is active, and the reverse). */
.gf-tile[data-muted="true"] { opacity: .38; box-shadow: 0 3px 0 var(--gf-ink); transform: translateY(3px); cursor: default; }
.gf-tiles[data-count="6"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gf-tile--num { font-size: clamp(28px, 4.4vw, 36px); }

/* Help content inside the frame popups. */
.af-help { display: grid; justify-items: center; gap: 10px; width: 100%; }
.af-help-copy { max-width: 34ch; font-size: clamp(18px, 2.2vw, 22px); font-weight: 600; line-height: 1.3; }
.af-help-growth { font-size: clamp(16px, 2vw, 20px); font-weight: 700; color: var(--af-bg-a, #6B3FA0); }
/* Keep the teaching array's largest orientation reserved during its turn. */
.af-help--teach .af-array {
  background: #fff;
  padding: 10px;
  border-radius: 12px;
  --af-turn-extent: calc(var(--af-turn-side) * var(--af-cell) + (var(--af-turn-side) - 1) * var(--af-gap) + 2 * clamp(6px, 1vw, 10px) + 6px);
  grid-template-columns: auto var(--af-turn-extent);
  grid-template-rows: var(--af-turn-extent) auto;
  justify-self: center;
}
.af-help-line { display: flex; align-items: center; gap: 10px; font-size: clamp(18px, 2.4vw, 24px); font-weight: 700; }
.af-help-line span { padding: 4px 12px; background: var(--af-picture, #F3F6FF); border: 2px solid var(--gf-dotted-border); border-radius: 12px; }
.af-help-line .af-help-times { padding: 0; background: none; border: 0; }
.af-help-line--done span { border-color: var(--gf-good); }
.af-help-next { font-size: clamp(16px, 2vw, 20px); font-weight: 700; color: var(--af-bg-a, #6B3FA0); }
.af-help-both--done { border-color: var(--gf-accent); }
.af-help-both { padding: 6px 16px; background: #fff; border: 3px solid var(--gf-good); border-radius: 999px; font-size: clamp(20px, 2.8vw, 28px); font-weight: 700; }

/* Start Lesson. */
.af-example { display: grid; justify-items: center; gap: 10px; }
.af-example-label { font-family: var(--gf-font-shout); font-size: 20px; letter-spacing: 1px; color: var(--af-bg-a, #6B3FA0); }
.af-example-line { font-size: 17px; font-weight: 600; }
.af-example-expr { display: inline-block; padding: 2px 10px; background: #fff; border: 2px solid var(--gf-good); border-radius: 10px; transition: background .3s, transform .3s; }
.af-example-expr--lit { background: var(--af-sticker, #FFD45A); transform: scale(1.08); }
.af-array--example .af-page { transform-origin: 50% 50%; }
.af-example-copy { max-width: 46ch; font-size: 17px; font-weight: 600; line-height: 1.3; }

/* End Screen album. */
.af-album-title { margin-top: 4px; font-family: var(--gf-font-shout); font-size: 22px; letter-spacing: 1px; color: var(--af-bg-a, #6B3FA0); }
.af-album { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 8px 0 14px; }
.af-album-item {
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 8px;
  background: #fff;
  border: 3px solid var(--gf-ink);
  border-radius: 12px;
  box-shadow: 0 3px 0 var(--gf-ink);
  animation: af-album-in .4s cubic-bezier(.2,.9,.3,1.2) both;
  animation-delay: var(--af-album-delay, 0ms);
}
@keyframes af-album-in { from { opacity: 0; transform: scale(.5) rotate(-8deg); } to { opacity: 1; transform: none; } }
.af-album-mini { display: grid; grid-template-columns: repeat(var(--af-cols), 9px); gap: 2px; }
.af-album-dot { display: block; width: 9px; height: 9px; border: 1px solid var(--gf-ink); border-radius: 2px; }
.af-album-dot--star { background: var(--af-sticker, #FFD45A); }
.af-album-dot--circle { background: var(--af-sticker-alt, #6BCBFF); border-radius: 50%; }
.af-album-dot--diamond { background: var(--af-sticker-third, #FF8FAB); transform: rotate(45deg) scale(.8); }
.af-album-text { font-size: 15px; font-weight: 700; }

/* Celebration pieces. */
.af-confetti {
  position: absolute;
  top: -20px;
  width: 14px;
  height: 14px;
  background: var(--af-piece, #ffd45a);
  border: 2px solid var(--gf-ink);
  border-radius: 3px;
  animation: af-fall linear forwards;
}
.af-confetti--circle { border-radius: 50%; }
.af-confetti--diamond { transform: rotate(45deg); }
@keyframes af-fall { to { transform: translateY(110vh) rotate(720deg); opacity: .85; } }
.af-fly { position: absolute; font-size: 28px; color: #ffd45a; text-shadow: 2px 2px 0 var(--gf-ink); animation: af-fly .9s ease-out forwards; }
@keyframes af-fly { to { transform: translate(var(--dx), -140px) scale(1.4); opacity: 0; } }
.gf-toast--tier { color: #ffd45a; font-size: clamp(36px, 8vw, 64px); }

/* Compact phones. */
@media (max-width: 560px) {
  .af-card { row-gap: 6px; padding: 2px 0; }
  .game-frame--af .gf-prompt { padding: 8px 10px; font-size: 17px; }
  .game-frame--af .gf-stage { gap: 10px; }
  .game-frame--af .gf-problem-card { padding: 8px 8px 6px; }
  /* Completion: a wide array sits above the Expression Rows; a tall array
     (more rows than columns) keeps the rows beside it, labels stacked, so
     five-row arrays stay countable. */
  .af-card--complete { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; column-gap: 0; padding-right: 0; row-gap: 6px; }
  .af-card--complete .af-array--card { grid-column: 1; grid-row: 1; }
  .af-card--complete .af-rows { grid-column: 1; grid-row: 2; grid-template-columns: 1fr 1fr; max-width: none; justify-items: center; gap: 4px; }
  .af-card--complete .af-row { grid-template-columns: 1fr; justify-items: center; gap: 2px; }
  .af-card--complete.af-card--tall { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); column-gap: 8px; padding-right: 4px; }
  .af-card--complete.af-card--tall .af-rows { grid-column: 2; grid-row: 1; grid-template-columns: 1fr; justify-items: start; gap: 10px; padding-top: 44px; }
  .af-card--complete.af-card--tall .af-row { grid-template-columns: 1fr; justify-items: start; gap: 2px; }
  .af-card--complete.af-card--tall .af-rows .af-equals { justify-self: start; }
  /* Keep the page clear of the 44px sound control in the card's top-right
     corner: the array (or the closed cover) centers in the room to its left. */
  .af-card--select .af-array--card, .af-card--product .af-array--card, .af-card--complete:not(.af-card--tall) .af-array--card, .af-cover { width: calc(100% - 44px); justify-self: start; }
  .af-rows .af-equals { justify-self: center; margin-top: 0; }
  .af-row-label { font-size: 14px; }
  .af-row-line { min-height: 34px; gap: 4px; }
  .af-slot { min-height: 32px; font-size: 20px; }
  .af-slot--blank { padding: 2px 8px; border-width: 2px; }
  .af-slot--times { font-size: 18px; }
  .af-equals { padding: 3px 12px; font-size: 17px; border-width: 2px; }
  .af-cover { max-height: 150px; padding: 8px; }
  .af-cover-sticker { width: 56px; height: 56px; font-size: 34px; }
  .af-cover-copy { font-size: 13px; margin-top: 6px; }
  .gf-tiles[data-count="6"] .gf-tile { padding: 6px 4px; font-size: 19px; }
  .gf-tile--num { font-size: 26px; }
  .af-caption { padding: 3px 12px; font-size: 15px; border-width: 2px; }
  .af-page { padding: 4px; border-width: 2px; box-shadow: 0 2px 0 var(--gf-ink); }
  .af-array--card .af-grid {
    --af-gap: 2px;
    --af-cell: min(
      calc((100cqw - 12px - (var(--af-cols) - 1) * var(--af-gap)) / var(--af-cols)),
      calc((100cqh - 12px - (var(--af-rows) - 1) * var(--af-gap)) / var(--af-rows)),
      72px
    );
  }
  .gf-tiles--multi { gap: 8px; }
  .gf-tiles--multi .gf-tile { min-height: 50px; }
  .gf-stats { gap: 8px; margin: 10px 0; }
  .gf-stat { min-width: 78px; padding: 6px 8px; font-size: 14px; }
  .gf-stat b { font-size: 24px; }
  .af-album { gap: 6px; }
  .af-album-item { padding: 5px; }
  .af-help-copy { font-size: 16px; }
  .af-help-line { font-size: 16px; gap: 6px; }
  .af-help-both { font-size: 20px; }
  .af-array--help { --af-cell: 20px; --af-gap: 3px; }
  .af-brace { font-size: 13px; }
  .af-example-copy, .af-example-line { font-size: 17px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .gf-tiles--multi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .gf-tiles[data-count="6"] { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .af-card { row-gap: 6px; }
}
/* Motion pass 1 (2026-09-12): feel only, no layout or copy change. Every
   rule below is disabled by the reduced-motion block at the end. */

/* Problem Card and Answer Grid enter like a page turning in, tiles staggered. */
.af-card { animation: af-page-in .32s cubic-bezier(.2,.8,.3,1) both; transform-origin: left center; }
@keyframes af-page-in {
  0% { opacity: 0; transform: perspective(1200px) rotateY(-14deg) translateX(-10px); }
  100% { opacity: 1; transform: none; }
}
.gf-tiles .gf-tile { animation: af-tile-in .34s cubic-bezier(.2,.9,.3,1.25) backwards; }
.gf-tiles .gf-tile:nth-child(2) { animation-delay: 50ms; }
.gf-tiles .gf-tile:nth-child(3) { animation-delay: 100ms; }
.gf-tiles .gf-tile:nth-child(4) { animation-delay: 150ms; }
.gf-tiles .gf-tile:nth-child(5) { animation-delay: 200ms; }
.gf-tiles .gf-tile:nth-child(6) { animation-delay: 250ms; }
@keyframes af-tile-in { 0% { opacity: 0; transform: translateY(14px) scale(.94); } 100% { opacity: 1; transform: none; } }

/* Wrong tap: one short shake, amber. The page (or closed cover) gives a
   small wobble too, so the miss reads as "look here". */
.gf-tile.gf-wrong { animation: af-shake .4s ease-in-out; }
@keyframes af-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
.af-card--nudge .af-page, .af-card--nudge .af-cover { animation: af-nudge .5s ease-in-out; }
@keyframes af-nudge { 25% { transform: rotate(-1.2deg); } 60% { transform: rotate(1deg); } 100% { transform: none; } }

/* Found expression or number: the tile pops and the check stamps on; on a
   select-all card the page ticks up. */
.gf-tile.gf-right { animation: af-tile-pop .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes af-tile-pop { 0% { transform: scale(1); } 45% { transform: scale(1.07); } 100% { transform: none; } }
.gf-tile[data-found="true"] .gf-answer-content::before { display: inline-block; animation: af-stamp .38s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes af-stamp { 0% { opacity: 0; transform: scale(1.9) rotate(-12deg); } 60% { opacity: 1; transform: scale(.9); } 100% { opacity: 1; transform: none; } }
.af-array--tick .af-page { animation: af-tick .3s ease-out; }
@keyframes af-tick { 40% { transform: translateY(-3px); } 100% { transform: none; } }

/* The tapped label on its way to the writing line. */
.af-fly-label {
  position: absolute;
  z-index: 3;
  color: var(--gf-ink);
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* The quarter turn: the page lifts off the album (its shadow grows), turns,
   then lands with a small overshoot while its stickers settle one by one. */
.af-page--flip { animation: af-flip .46s cubic-bezier(.45,0,.75,.35) both; }
@keyframes af-flip {
  0% { transform: rotate(0) scale(1) translateY(0); }
  35% { transform: rotate(18deg) scale(1.04) translateY(-10px); box-shadow: 0 16px 0 rgb(19 33 63 / 35%); }
  100% { transform: rotate(90deg) scale(.55) translateY(-6px); box-shadow: 0 16px 0 rgb(19 33 63 / 35%); }
}
.af-page--land { animation: af-land .34s cubic-bezier(.2,.9,.3,1.35) both; }
@keyframes af-land {
  0% { transform: rotate(-10deg) scale(.55) translateY(-6px); box-shadow: 0 16px 0 rgb(19 33 63 / 35%); }
  70% { transform: rotate(2deg) scale(1.04); }
  100% { transform: none; }
}
.af-page--land .af-cell { animation: af-settle .36s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: calc(var(--af-i, 0) * 14ms); }
@keyframes af-settle { 0% { transform: scale(.8) rotate(-8deg); } 100% { transform: none; } }

/* The commutative statement stamps on. */
.af-equals { animation: af-stamp-in .42s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes af-stamp-in {
  0% { opacity: 0; transform: scale(1.6) rotate(-6deg); }
  55% { opacity: 1; transform: scale(.94) rotate(1deg); box-shadow: 0 0 0 8px rgb(55 200 197 / 30%); }
  100% { opacity: 1; transform: none; box-shadow: 0 0 0 0 rgb(55 200 197 / 0%); }
}
.af-equals--float { animation-name: af-equals-float; }

/* Product form: the closed album cover swings open before its page appears. */
.af-cover { transform-origin: left center; }
.af-cover--open { animation: af-cover-open .42s cubic-bezier(.5,0,.6,1) both; }
@keyframes af-cover-open {
  0% { transform: perspective(1600px) rotateY(0); opacity: 1; }
  70% { opacity: .5; }
  100% { transform: perspective(1600px) rotateY(-80deg); opacity: 0; }
}
.af-cover--open .af-cover-sticker { animation: none; }

/* HUD chips bump when their number changes; hot streak glows. */
.gf-chip { transition: background .3s; }
.af-bump-once { animation: af-bump-once .4s cubic-bezier(.2,.9,.3,1.3); }
@keyframes af-bump-once { 40% { transform: scale(1.18); } 100% { transform: none; } }
.gf-chip--hot { animation: af-hot 1.6s ease-in-out infinite alternate; }
@keyframes af-hot { from { box-shadow: 0 3px 0 var(--gf-ink); } to { box-shadow: 0 3px 0 var(--gf-ink), 0 0 12px 3px rgb(255 212 90 / 70%); } }
.gf-chip--hot.af-bump-once { animation: af-bump-once .4s cubic-bezier(.2,.9,.3,1.3), af-hot 1.6s ease-in-out infinite alternate; }

/* Teaching help: the row count bumps as each row lights (af-bump-once), and
   both expressions pulse once when the second count finishes. */
.af-help-rows.af-bump-once { display: inline-block; }
.af-help-both--done { animation: af-both-pulse .6s ease-out; }
@keyframes af-both-pulse { 30% { transform: scale(1.08); box-shadow: 0 0 0 6px rgb(55 200 197 / 35%); } 100% { transform: none; } }
.af-example-expr.af-bump-once { display: inline-block; }

/* Confetti pieces are real sticker shapes and sway as they fall. */
.af-confetti--star { border: 0; border-radius: 0; width: 18px; height: 18px; clip-path: polygon(50% 0, 62% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 38% 35%); }
.af-confetti { animation-timing-function: ease-in; }
@keyframes af-fall { 0% { transform: translateY(0) rotate(0) translateX(0); } 50% { transform: translateY(55vh) rotate(360deg) translateX(var(--af-sway, 0px)); } 100% { transform: translateY(110vh) rotate(720deg) translateX(0); opacity: .85; } }

/* Start and End Screens: the card rises in; end stats stagger. */
.gf-start-card { animation: af-card-rise .45s cubic-bezier(.2,.9,.3,1.2) both; }
.gf-end-card.af-rise { animation: af-card-rise .45s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes af-card-rise { 0% { opacity: 0; transform: translateY(28px) scale(.96); } 100% { opacity: 1; transform: none; } }
.gf-end-card .gf-stat { animation: af-tile-in .4s cubic-bezier(.2,.9,.3,1.25) backwards; animation-delay: calc(200ms + var(--af-i, 0) * 90ms); }
.gf-end-card .gf-stat:nth-child(2) { --af-i: 1; }
.gf-end-card .gf-stat:nth-child(3) { --af-i: 2; }

@media (prefers-reduced-motion: reduce) {
  .af-array--peel .af-cell, .af-cell--shine, .af-album-item, .af-card, .gf-tiles .gf-tile, .gf-tile.gf-wrong, .gf-tile.gf-right, .gf-tile[data-found="true"] .gf-answer-content::before, .af-page, .af-page--flip, .af-page--land, .af-page--land .af-cell, .af-card--nudge .af-page, .af-card--nudge .af-cover, .af-array--tick .af-page, .af-equals, .af-cover, .af-cover--open, .af-cover-sticker, .gf-chip, .gf-chip--hot, .af-bump-once, .af-help-both--done, .af-slot--active, .af-slot--filled, .af-example-expr, .gf-screen .gf-card, .gf-end-card .gf-stat { animation: none !important; transition: none !important; }
  .af-cover--open { opacity: 0; }
}
/* 90s style kit shared by every game. Bangers for shouting, Fredoka for
   reading. Saturated gradients from Eric's palette, white cards, thick
   outlines, chunky shadows, confetti. Games override the --mg-* tokens
   through mount options (theme) rather than writing their own chrome. */

:root {
  --mg-bg-a: #667eea;
  --mg-bg-b: #764ba2;
  --mg-ink: #1a1a2e;
  --mg-card: #ffffff;
  --mg-accent: #ffd93d;
  --mg-good: #2ed573;
  --mg-warm: #E8A838;
  --mg-sky: #6bcbff;
  --mg-outline: 4px;
  --mg-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
  --mg-font-shout: 'Bangers', 'Impact', cursive;
  --mg-font-read: 'Fredoka', 'Nunito', system-ui, sans-serif;
  /* Header. The game name is capped at --mg-hud-title-max, a flat ceiling:
     40px normal, 30px on compact widths. Bangers caps measure
     --mg-title-cap-ratio of the font size, so the name stands about 30px
     against the --mg-chip-box-height chip beside it. The name never
     truncates: session.js measures the header space left after the chips and
     shrinks the name to fit one line, down to --mg-hud-title-min, the shell's
     15px kid-readable floor. A name that still does not fit at the floor
     wraps to two lines inside the chip height instead of ellipsising. */
  --mg-chip-box-height: 44px;
  --mg-title-cap-ratio: 0.75;
  --mg-hud-title-max: 40px;
  --mg-hud-title-min: 15px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--mg-font-read);
  color: #fff;
  background: linear-gradient(135deg, var(--mg-bg-a) 0%, var(--mg-bg-b) 100%);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.mg-root { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.mg-root.cc-game { overflow: visible; }
.mg-hidden { display: none !important; }

/* start + end overlays */
.mg-screen {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  background: linear-gradient(135deg, var(--mg-bg-a) 0%, var(--mg-bg-b) 100%);
}
.mg-card {
  width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto;
  background: var(--mg-card); color: var(--mg-ink);
  border: var(--mg-outline) solid var(--mg-ink); border-radius: 24px;
  box-shadow: var(--mg-shadow); padding: 24px 22px; text-align: center;
}
.mg-emoji { font-size: 56px; line-height: 1; }
.mg-title {
  font-family: var(--mg-font-shout); font-size: clamp(34px, 8vw, 52px); letter-spacing: 2px;
  color: var(--mg-ink); text-shadow: 3px 3px 0 var(--mg-accent); margin-top: 6px;
}
.mg-subtitle { font-size: 20px; font-weight: 600; margin-top: 4px; }
.mg-tag {
  display: inline-block; margin-top: 8px; padding: 4px 10px;
  border-radius: 999px; background: #f5f3ff; color: var(--mg-bg-b);
  font-size: 13px; font-weight: 700; letter-spacing: 1px;
}
.mg-example {
  margin: 16px 0; padding: 14px; border-radius: 16px;
  background: #f5f3ff; border: 3px dashed var(--mg-bg-a); font-size: 18px;
}
.mg-big-btn {
  font-family: var(--mg-font-shout); font-size: 30px; letter-spacing: 2px;
  color: var(--mg-ink); background: var(--mg-accent);
  border: var(--mg-outline) solid var(--mg-ink); border-radius: 999px;
  padding: 14px 40px; min-height: 64px; cursor: pointer;
  box-shadow: 0 6px 0 var(--mg-ink); transition: transform 0.08s, box-shadow 0.08s;
}
.mg-big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--mg-ink); }

/* HUD */
.mg-hud {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; font-family: var(--mg-font-shout); letter-spacing: 1px;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35);
}
.cc-game .mg-hud,
.cc-game .mg-progress,
.cc-game .mg-stage { width: min(900px, calc(100% - 32px)); margin-left: auto; margin-right: auto; }
.cc-game .mg-hud { padding-left: 0; padding-right: 0; }
.cc-game .mg-progress { margin-top: 0; }
/* The size resolves on this element: it starts at the ceiling, and session.js
   writes the fitted size back into --mg-hud-title-size when the ceiling does
   not fit the header on one line. */
.mg-hud-title {
  --mg-hud-title-size: var(--mg-hud-title-max);
  font-size: var(--mg-hud-title-size);
  /* overflow: hidden is the last-ditch guard, and it clips both axes, so the
     line box has to hold the whole Bangers glyph box plus the header
     text-shadow. line-height: 1 cut the caps at the top and the tails at the
     bottom. */
  line-height: 1.35; overflow: hidden; white-space: nowrap; min-width: 0;
}
/* At the floor a long name wraps to two lines rather than truncating. Two
   lines at the 15px floor stand 36px, inside the 44px chip box. */
.mg-hud-title[data-hud-title-lines="2"] {
  white-space: normal; line-height: 1.2; overflow-wrap: break-word;
}
/* Compact widths take the ceiling down in proportion, 40px to 30px. */
@media (max-width: 560px) {
  :root { --mg-hud-title-max: 30px; }
}
/* Leave room for Bangers glyph overhang and the header shadow. */
:is(.cc-game, .eb-game, .ct-game, .reb-game) .mg-hud-title { padding-inline: 0.15em; }
.mg-chips { display: flex; gap: 8px; flex-shrink: 0; }
.mg-chip {
  background: var(--mg-card); color: var(--mg-ink); border: 3px solid var(--mg-ink);
  border-radius: 999px; padding: 4px 12px; font-size: 18px; text-shadow: none;
  box-shadow: 0 3px 0 var(--mg-ink);
}
.mg-chip-score { display: flex; align-items: center; justify-content: center; min-height: var(--mg-chip-box-height); line-height: 1; }
.cc-game .mg-card { width: min(900px, 100%); }
.mg-chip-streak.mg-hot { background: var(--mg-accent); animation: mg-pulse 0.8s infinite alternate; }
.mg-progress { height: 10px; margin: 0 14px; background: rgba(0, 0, 0, 0.25); border-radius: 999px; overflow: hidden; }
.mg-progress > i { display: block; height: 100%; width: 0; background: var(--mg-good); transition: width 0.3s; }

/* play area */
.mg-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 14px 14px; gap: 10px; }
.cc-game .mg-stage { flex: none; height: calc(100vh - 124px); min-height: 0; max-height: calc(100vh - 50px); display: grid; grid-template-rows: auto auto minmax(0, 1fr); padding: clamp(6px, 1vh, 10px) 0 50px; gap: 0; overflow: hidden; }
.mg-prompt {
  background: var(--mg-card); color: var(--mg-ink); border: var(--mg-outline) solid var(--mg-ink);
  border-radius: 20px; box-shadow: var(--mg-shadow); padding: 14px; text-align: center;
  font-size: clamp(20px, 4vw, 28px); font-weight: 600;
}
.mg-visual { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.cc-game .mg-visual { flex: none; min-height: 0; align-items: flex-start; margin-top: var(--cc-prompt-tray-gap); margin-bottom: var(--cc-tray-answers-gap); }
.mg-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mg-tiles[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mg-tile {
  min-height: 72px; font-family: var(--mg-font-read); font-weight: 700; font-size: 24px;
  color: var(--mg-ink); background: var(--mg-card);
  border: var(--mg-outline) solid var(--mg-ink); border-radius: 18px;
  box-shadow: 0 5px 0 var(--mg-ink); cursor: pointer; padding: 10px;
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
}
.mg-tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--mg-ink); }
.mg-tile[disabled] { cursor: default; }
.mg-tile.mg-right { background: var(--mg-good); }
.mg-tile.mg-wrong { background: var(--mg-warm); }
.cc-game .mg-tiles { width: 100%; min-height: 0; gap: var(--cc-answer-gap); grid-auto-rows: minmax(clamp(64px, 15vh, 180px), 1fr); }
.cc-game .mg-tile { min-height: 0; height: 100%; }

/* feedback */
.mg-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.mg-toast {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  font-family: var(--mg-font-shout); font-size: clamp(36px, 9vw, 64px); letter-spacing: 3px;
  color: #fff; text-shadow: 4px 4px 0 var(--mg-ink); animation: mg-toast 0.9s ease-out forwards;
}
.mg-toast-good { font-size: clamp(45px, 9vw, 84px); }
.mg-toast-warm { color: var(--mg-warm); font-size: clamp(28px, 7vw, 44px); }
.mg-toast-tier { color: var(--mg-accent); top: 30%; }
.mg-confetti {
  position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px;
  animation: mg-fall linear forwards;
}
.mg-fly { position: absolute; font-size: 28px; animation: mg-fly 0.9s ease-out forwards; }
.mg-shake { animation: mg-shake 0.35s; }
.mg-stats { display: flex; justify-content: center; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
.mg-stat { background: #f5f3ff; border: 3px solid var(--mg-ink); border-radius: 16px; padding: 10px 18px; min-width: 110px; }
.mg-stat b { display: block; font-family: var(--mg-font-shout); font-size: 32px; letter-spacing: 1px; }
.mg-hint { font-size: 14px; opacity: 0.7; margin-top: 10px; }

@media (max-width: 560px) {
  .cc-game .mg-tiles { gap: clamp(7px, 2vw, 12px); }
  .cc-game .mg-tile { min-height: clamp(64px, 15vw, 88px); --cc-pad: 7px; }
}

@media (max-height: 850px) {
  .cc-game .mg-tile { --cc-pad: clamp(7px, 1vh, 10px); }
}

@media (orientation: landscape) and (max-height: 500px) {
  .mg-toast-good { font-size: 45px; }
}

/* Standard Shell v1. Opt in with game.layout = 'standard'; legacy games keep
   the base shell above. Games add the semantic classes below to their own
   content without changing the shared stage DOM. */
.mg-shell-standard {
  --mg-standard-max-width: 920px;
  --mg-standard-gutter: 16px;
  --mg-standard-compact-gutter: 10px;
  --mg-standard-answer-shadow-depth: 6px;
  --mg-standard-answer-clearance: 60px;
  --mg-standard-answer-min-height: 104.85px;
  --mg-standard-answer-compact-min-height: 66.6px;
  --mg-standard-answer-narrow-min-height: 57.15px;
  --mg-standard-answer-landscape-height: 54px;
  /* Expression row. Sizes come from the ML 1.04 original: the label is a
     small line over a big value, and the value always leads. Games set
     colours only, through the --mg-expression-slot-* properties below. */
  --mg-expression-label-size: 32px;
  --mg-expression-value-size: clamp(26px, 5vw, 38px);
  --mg-expression-operator-size: 42px;
  --mg-expression-slot-min-height: 92px;
  --mg-expression-slot-padding: 6px 10px;
  --mg-expression-gap: 8px;
  --mg-expression-slot-radius: 12px;
  --mg-expression-slot-border-width: 3px;
  --mg-expression-slot-border-color: var(--mg-ink);
  --mg-expression-slot-bg: transparent;
  --mg-expression-slot-bg-filled: var(--mg-expression-slot-bg);
}
.mg-shell-standard .mg-hud,
.mg-shell-standard .mg-progress,
.mg-shell-standard .mg-stage {
  width: min(var(--mg-standard-max-width), calc(100% - (var(--mg-standard-gutter) * 2)));
  margin-left: auto;
  margin-right: auto;
}
.mg-shell-standard .mg-hud { padding: 10px 0; }
.mg-shell-standard .mg-hud-title { font-size: var(--mg-hud-title-size); }
.mg-shell-standard .mg-chip { font-size: 18px; }
.mg-shell-standard .mg-progress { height: 10px; }
.mg-shell-standard .mg-stage {
  gap: 20px;
  padding: 10px 0 calc(var(--mg-standard-answer-clearance) + var(--mg-standard-answer-shadow-depth) + env(safe-area-inset-bottom, 0px));
}
.mg-shell-standard .mg-prompt { font-size: 28px; }
.mg-shell-standard .mg-visual { flex: 1 1 auto; }
.mg-shell-standard .mg-problem-card {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}
.mg-shell-standard .mg-problem-card .mg-expression-row { min-width: 0; }
.mg-shell-standard .mg-tiles {
  width: min(686px, 85%);
  align-self: center;
  gap: 10.8px;
}
.mg-shell-standard .mg-tile {
  min-height: var(--mg-standard-answer-min-height);
  font-size: clamp(24px, 4vw, 32px);
  box-shadow: 0 var(--mg-standard-answer-shadow-depth) 0 var(--mg-ink);
}
.mg-shell-standard .mg-tile:active { box-shadow: 0 2px 0 var(--mg-ink); }

/* Semantic content classes. Games own their content layout and add these
   alongside local class names to receive the shared type floors. */
/* No :where() here: the shell's type declarations must beat a game's local
   class on specificity, so these carry the full .mg-shell-standard .mg-class
   weight and win over a single game class. */
.mg-shell-standard :is(.mg-problem-body, .mg-card-stem) {
  font-size: 32px;
  line-height: 1.3;
}
/* An instruction stem inside the problem card is story copy: `.mg-card-stem`
   is typed identically to `.mg-problem-body` at every breakpoint, so a stem
   reads at the story size in the card's own ink colour. */
/* The same rule outside the Standard Shell, where the card is the prompt
   itself: the stem takes the story's own size, weight and colour by
   inheriting them, and drops to the shell's 15px story floor on compact
   widths so two sentences still hold two lines on a phone. The Standard
   Shell rules above and below outrank this on specificity, so they keep
   their own sizes. */
.mg-card-stem { font-size: inherit; font-weight: inherit; color: inherit; }
@media (max-width: 560px) {
  .mg-card-stem { font-size: 15px; }
}
/* Expression row: slots across the card, each a small label line over a big
   value line, with the operator between. The unknown slot is dashed. The
   value line reserves its height so the geometry never shifts. */
.mg-shell-standard .mg-expression-row {
  display: flex;
  align-items: stretch;
  justify-content: center;
  min-width: 0;
  gap: var(--mg-expression-gap);
}
.mg-shell-standard .mg-expression-slot {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  align-content: center;
  justify-items: center;
  row-gap: 2px;
  min-height: var(--mg-expression-slot-min-height);
  padding: var(--mg-expression-slot-padding);
  border: var(--mg-expression-slot-border-width) solid var(--mg-expression-slot-border-color);
  border-radius: var(--mg-expression-slot-radius);
  background: var(--mg-expression-slot-bg-filled);
}
.mg-shell-standard .mg-expression-slot--unknown {
  border-style: dashed;
  background: var(--mg-expression-slot-bg);
}
.mg-shell-standard .mg-expression-label {
  max-width: 100%;
  font-family: var(--mg-font-read);
  font-size: var(--mg-expression-label-size);
  font-weight: 700;
  line-height: var(--mg-expression-label-line-height, 1.05);
}
.mg-shell-standard .mg-expression-value {
  display: flex;
  align-items: baseline;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 0.18em;
  max-width: 100%;
  min-height: 1.15em;
  font-family: var(--mg-font-shout);
  font-size: var(--mg-expression-value-size);
  font-weight: 400;
  line-height: var(--mg-expression-value-line-height, 1.15);
}
.mg-shell-standard .mg-expression-row--readable-numerals .mg-expression-value {
  font-family: var(--mg-font-read);
  font-weight: 700;
}
.mg-shell-standard .mg-expression-value .mg-expression-operator { font-size: 1em; }
.mg-shell-standard .mg-expression-operator {
  align-self: center;
  font-family: var(--mg-font-shout);
  font-size: var(--mg-expression-operator-size);
  font-weight: 400;
  line-height: 1.15;
}
.mg-shell-standard .mg-feedback-line,
.mg-shell-standard .mg-help-copy,
.mg-shell-standard .mg-toast-warm {
  font-size: clamp(15px, 3vw, 28px);
  line-height: 1.1;
}
.mg-shell-standard .mg-toast-good { line-height: 1.1; }
.mg-shell-standard .mg-feedback-line {
  font-family: var(--mg-font-read);
  font-weight: 700;
  min-height: 31px;
  overflow: hidden;
}
.mg-shell-standard .mg-feedback-line:empty { visibility: hidden; }
.mg-shell-standard .mg-help-panel { min-width: 0; }
.mg-shell-standard .mg-kid-label:not(.mg-expression-label):not(.mg-expression-value):not(.mg-expression-operator),
.mg-shell-standard .mg-stat {
  font-size: max(15px, 1em);
}
.mg-shell-standard .mg-tag,
.mg-shell-standard .mg-hint {
  font-size: 15px;
}

/* Problem card interior + Expression row. Opt in with `mg-card-column` on the
   problem card (and `mg-card-picture` on its picture child), paired with
   `mg-expression-row` on equation rows. The shell owns every value below; a
   game overrides nothing. 103 and 104 do not opt in, so these selectors never
   match their DOM. Values track docs/game-guidelines.md. */
.mg-shell-standard .mg-card-column {
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 12px; /* floor, normal; space-evenly grows gaps equally above it */
}
.mg-shell-standard .mg-card-column > .mg-card-picture {
  max-height: 40vh; /* normal; keeps the picture from absorbing the slack */
  min-height: 0;
}
.mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall {
  max-height: 55vh;
}
/* Ceiling: on tall viewports the even share would exceed 32px, so stop
   stretching, let the card size to its content, and centre it in the stage. */
@media (min-height: 900px) {
  .mg-shell-standard .mg-card-column {
    flex: 0 1 auto;
    height: auto;
    margin-top: auto;
    margin-bottom: auto;
  }
}

@media (max-width: 560px) {
  .mg-shell-standard .mg-hud,
  .mg-shell-standard .mg-progress,
  .mg-shell-standard .mg-stage {
    width: min(var(--mg-standard-max-width), calc(100% - (var(--mg-standard-compact-gutter) * 2)));
  }
  .mg-shell-standard .mg-prompt { font-size: 20px; }
  .mg-shell-standard .mg-stage { gap: 14px; }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-compact-min-height); }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem) { font-size: 18px; line-height: 1.3; }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem).mg-problem-body--fit2 { font-size: 15px; }
  .mg-shell-standard {
    --mg-expression-label-size: 18px;
    --mg-expression-value-size: 31.5px;
    --mg-expression-operator-size: 37.8px;
    --mg-expression-slot-min-height: 68px;
    --mg-expression-slot-padding: 4px 6px;
    --mg-expression-gap: 6px;
    --mg-expression-slot-radius: 10px;
    --mg-expression-slot-border-width: 2px;
  }
  .mg-shell-standard .mg-card-column { gap: 8px; }
  .mg-shell-standard .mg-card-column > .mg-card-picture { max-height: 30vh; }
  .mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall { max-height: 40vh; }
}

@media (max-width: 360px) and (max-height: 600px) {
  .mg-shell-standard {
    --mg-expression-label-size: 15px;
    --mg-expression-value-size: 26px;
    --mg-expression-operator-size: 30px;
    --mg-expression-slot-min-height: 52px;
    --mg-expression-slot-padding: 2px 4px;
    --mg-expression-gap: 4px;
  }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-narrow-min-height); }
}

@media (orientation: landscape) and (max-height: 500px) {
  .mg-shell-standard .mg-stage { gap: 14px; padding-top: 4px; }
  .mg-shell-standard .mg-prompt { font-size: 20px; }
  .mg-shell-standard .mg-tiles { flex: 0 0 var(--mg-standard-answer-landscape-height); }
  .mg-shell-standard .mg-tiles[data-count="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .mg-shell-standard .mg-tile { min-height: var(--mg-standard-answer-landscape-height); padding: 4px 10px; line-height: 1; }
  .mg-card-stem { font-size: 15px; }
  .mg-shell-standard :is(.mg-problem-body, .mg-card-stem) { font-size: 15px; line-height: 1.1; }
  .mg-shell-standard {
    --mg-expression-label-size: 15px;
    --mg-expression-value-size: 31.5px;
    --mg-expression-operator-size: 37.8px;
    --mg-expression-slot-min-height: 52px;
    --mg-expression-slot-padding: 2px 5px;
    --mg-expression-gap: 4px;
    --mg-expression-slot-radius: 10px;
    --mg-expression-slot-border-width: 2px;
  }
  .mg-shell-standard .mg-feedback-line,
  .mg-shell-standard .mg-help-copy,
  .mg-shell-standard .mg-toast-warm { font-size: 15px; }
  .mg-shell-standard .mg-card-column { gap: 8px; }
  .mg-shell-standard .mg-card-column > .mg-card-picture { max-height: 30vh; }
  .mg-shell-standard .mg-card-column > .mg-card-picture.mg-card-picture--tall { max-height: 40vh; }
}

@media (prefers-reduced-motion: reduce) {
  .mg-shell-standard :is(.mg-toast, .mg-fly, .mg-confetti, .mg-shake, .mg-chip-streak.mg-hot) {
    animation: none !important;
  }
  .mg-shell-standard :is(.mg-big-btn, .mg-tile) { transition: none !important; }
  .mg-shell-standard .mg-progress > i { transition: none !important; }
}

@keyframes mg-toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
@keyframes mg-fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.8; } }
@keyframes mg-fly { to { transform: translate(var(--dx), -140px) scale(1.4); opacity: 0; } }
@keyframes mg-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes mg-pulse { to { transform: scale(1.08); } }
/* Equal side columns keep the title centered across the complete header. */
.game-home-header:is(.mg-hud, .gf-hud) {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr);
  align-items: center; gap: 8px;
}
.game-home-header > :is(.mg-hud-title, .gf-hud-title) { text-align: center; min-width: 0; width: 100%; }
.game-home-header > :is(.mg-chips, .gf-chips) { justify-self: end; }
.game-home {

  box-sizing: border-box; width: 48px; min-height: 48px; flex-shrink: 0;
  background: var(--mg-card, #fff5d6); color: var(--mg-ink, #142343);
  border: 3px solid var(--mg-ink, #142343); border-radius: 14px;

  font: 700 20px var(--mg-font-read, 'Fredoka', sans-serif);

.game-home:focus-visible { outline: 4px solid #ffd93d; outline-offset: 4px; }
.game-home:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mg-ink, #142343); }
.game-end-actions { display: flex; justify-content: center; align-items: stretch; gap: 12px; margin-top: 12px; }
.game-end-actions > .game-home-labeled { width: auto; min-height: 64px; padding: 10px 20px; }
.game-end-actions > :is(.mg-big-btn, .gf-big-btn) { margin: 0; }
.game-home-header > .gf-hud-title { font-size: clamp(15px, 2.6vw, 40px); white-space: normal; overflow-wrap: anywhere; }
.game-home-header > :is(.mg-chips, .gf-chips) { width: max-content; white-space: nowrap; }
.gf-root .game-home, .gf-game .game-home { background: var(--gf-card, #fff5d6); color: var(--gf-ink, #142343); }
.game-home-header > .mg-hud-title { white-space: normal; overflow-wrap: anywhere; }
.gf-hud .game-home, .gf-end-card .game-home { background: var(--gf-card, #fff5d6); color: var(--gf-ink, #142343); }</style>
